    U.dataTable(m.el.querySelector('#ua-l'), [{ k: 'at', label: 'Waktu', fmt: dt }, { k: 'sessionId', label: 'Session' }, { k: 'agent', label: 'Perangkat', wrap: 1 }], logins.filter(a => a.userId === u.id), { pageSize: 6, search: false });
  }

  /* =================== 14. ACCESS MANAGEMENT =================== */
  Pages.access = {
    title: 'Access Management', icon: 'access', perm: ['permission.manage', 'user.manage'], filters: false,
    render() {
      const App = A(); const pm = App.data.settings.permissions || C.DEFAULT_ROLE_PERMS; const can = App.can('permission.manage'); const roles = Object.keys(C.ROLES);
      return U.pageHead('Role Based Access Control', 'Access Management', 'Matriks permission per role dan ringkasan akses project per user.', can ? `<button class="btn" id="ac-reset">Kembalikan default</button><button class="btn primary" id="ac-save">Simpan permission</button>` : '') +
        `<div class="grid">${U.card('Matriks role & permission', `<div class="tbl-wrap"><table class="tbl matrix"><thead><tr><th>Permission</th>${roles.map(r => `<th>${esc(C.ROLES[r].label)}</th>`).join('')}</tr></thead><tbody>${C.PERMISSIONS.map(([k, l]) => `<tr><td><b>${esc(l)}</b><div class="muted small mono">${k}</div></td>${roles.map(r => `<td><input type="checkbox" data-perm="${k}" data-role="${r}" ${r === 'super_admin' || (pm[r] || []).includes(k) ? 'checked' : ''} ${!can || r === 'super_admin' ? 'disabled' : ''} aria-label="${esc(l)} untuk ${esc(C.ROLES[r].label)}" style="width:16px;height:16px;accent-color:var(--accent)"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <p class="muted small" style="margin:10px 0 0">Super Admin selalu memiliki seluruh permission. Isolasi data per project ditegakkan juga oleh Firestore Security Rules sehingga tidak bisa dilewati dari browser.</p>`)}
          ${U.card('Akses project per user', '<div id="ac-users"></div>')}</div>`;
    },
    async mount() {
      const App = A(); const g = id => document.getElementById(id);
      if (g('ac-save')) g('ac-save').addEventListener('click', async () => {
        const pm = {}; Object.keys(C.ROLES).forEach(r => pm[r] = []); document.querySelectorAll('[data-perm]').forEach(i => { if (i.checked) pm[i.dataset.role].push(i.dataset.perm); }); pm.super_admin = C.PERMISSIONS.map(p => p[0]);
        try { await App.ds.saveSetting('permissions', pm); App.data.settings.permissions = pm; App.computeScope(); await App.audit('Change Permission', 'Matriks role-permission diperbarui'); U.toast('Permission tersimpan.', 'ok'); } catch (e) { U.toast(e.message, 'bad'); }
      });
      if (g('ac-reset')) g('ac-reset').addEventListener('click', async () => { if (!await U.confirmBox('Kembalikan default', 'Kembalikan matriks permission ke pengaturan default?', 'Kembalikan', false)) return; App.data.settings.permissions = JSON.parse(JSON.stringify(C.DEFAULT_ROLE_PERMS)); await App.ds.saveSetting('permissions', App.data.settings.permissions); await App.audit('Change Permission', 'Reset ke default'); App.render(); });
      const users = await App.ds.listUsers().catch(() => []);
      U.dataTable('ac-users', [{ k: 'name', label: 'User' }, { k: 'role', label: 'Role', fmt: roleLabel }, { k: 'scope', label: 'Cakupan data', sort: r => r.role, fmt: (v, r) => C.ROLES[r.role] && C.ROLES[r.role].all ? '<span class="pill info plain">Seluruh project</span>' : ((r.projects || []).map(id => `<span class="tag">${esc(App.proj(id).code)}</span>`).join('') + (r.customers || []).map(id => `<span class="tag">Customer: ${esc(App.cust(id).name)}</span>`).join('') || '<span class="pill bad plain">Tidak ada akses</span>') }, { k: 'status', label: 'Status', fmt: v => U.pill(v === 'active' ? 'ok' : 'na', v === 'active' ? 'Active' : 'Inactive') }], users, { sortK: 'role', pageSize: 10 });
    }
  };

  /* =================== 15. AUDIT LOG =================== */
  Pages.audit = {
    title: 'Audit Log', icon: 'audit', perm: 'audit.view', filters: false,
    render() { const App = A(); const tab = App.tabs('audit', [['log', 'Audit Trail'], ['login', 'Login History'], ['failed', 'Failed Login']]); return U.pageHead('Keamanan', 'Audit Log', 'Seluruh aktivitas user tercatat dan tidak dapat diubah.', `<button class="btn" id="al-export">${U.icon('download')} Export Excel</button>`) + tab.html + U.card('', '<div class="row" style="margin-bottom:10px" id="al-filter"></div><div id="al-table"></div>'); },
    async mount() {
      const App = A(); const cur = App.subTab.audit || 'log'; let data = [], cols = [];
      if (cur === 'log') { data = await App.ds.listAudit(1000).catch(e => { U.toast(e.message, 'bad'); return []; }); cols = [{ k: 'at', label: 'Timestamp', fmt: dt }, { k: 'userName', label: 'User' }, { k: 'activity', label: 'Activity', fmt: v => `<span class="tag">${esc(v)}</span>` }, { k: 'projectId', label: 'Project', fmt: v => esc(v ? App.proj(v).code : '–') }, { k: 'sessionId', label: 'IP / Session', fmt: (v, r) => `<span class="mono small">${esc(r.ip || v || '–')}</span>` }, { k: 'status', label: 'Status', fmt: v => U.pill(v === 'Success' ? 'ok' : 'bad', v) }, { k: 'detail', label: 'Detail', wrap: 1 }]; }
      else if (cur === 'login') { data = await App.ds.listLoginHistory().catch(() => []); cols = [{ k: 'at', label: 'Timestamp', fmt: dt }, { k: 'userName', label: 'User' }, { k: 'email', label: 'Email' }, { k: 'sessionId', label: 'Session' }, { k: 'agent', label: 'Perangkat', wrap: 1 }]; }
      else { data = await App.ds.listFailedLogins().catch(() => []); cols = [{ k: 'at', label: 'Timestamp', fmt: dt }, { k: 'email', label: 'Email / Username' }, { k: 'reason', label: 'Alasan' }]; }
      let view = data;
      if (cur === 'log') {
        const acts = [...new Set(data.map(d => d.activity))].sort();
        document.getElementById('al-filter').innerHTML = `<label class="small muted" for="al-act">Activity</label><select class="input" id="al-act" style="max-width:220px"><option value="">Semua aktivitas</option>${acts.map(a => `<option>${esc(a)}</option>`).join('')}</select><label class="small muted" for="al-from">Dari</label><input class="input" type="date" id="al-from" style="max-width:160px"><label class="small muted" for="al-to">Sampai</label><input class="input" type="date" id="al-to" style="max-width:160px">`;
        const tbl = U.dataTable('al-table', cols, data, { sortK: 'at', pageSize: 20 });
        const ap = () => { const a = val(document, 'al-act'), f = val(document, 'al-from'), t = val(document, 'al-to'); view = data.filter(d => (!a || d.activity === a) && (!f || d.at.slice(0, 10) >= f) && (!t || d.at.slice(0, 10) <= t)); tbl.refresh(view); };
        ['al-act', 'al-from', 'al-to'].forEach(id => document.getElementById(id).addEventListener('change', ap));
      } else U.dataTable('al-table', cols, data, { sortK: 'at', pageSize: 20 });
      document.getElementById('al-export').addEventListener('click', async () => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(view.map(d => { const o = Object.assign({}, d); delete o.serverAt; return o; })), 'Audit'); if (await U.saveFile(`Audit_${cur}_${new Date().toISOString().slice(0, 10)}.xlsx`, U.workbookBlob(wb))) App.audit('Export Report', 'Audit log ' + cur); });
    }
  };

  /* =================== 16. SYSTEM SETTINGS =================== */
  const KPI_FIELDS = [['scr', 'SCR %'], ['sl', 'SL %'], ['aht', 'AHT dtk'], ['quality', 'Quality'], ['pk', 'Prod. Knowl.'], ['productivity', 'Productivity %'], ['attendance', 'Attendance %'], ['login', 'Login Acc. %'], ['rt', 'Resp. Time dtk'], ['ht', 'Handl. Time dtk'], ['rr', 'Resp. Rate %']];
  Pages.settings = {
    title: 'System Settings', icon: 'settings', perm: ['kpi.configure', 'settings.manage'], filters: false,
    render() {
      const App = A(); const tab = App.tabs('settings', [['overview', 'System Overview'], ['kpi', 'KPI Configuration'], ['formula', 'Formula & Alert'], ['data', 'Data & Sistem']].filter(([k]) => k !== 'formula' || App.can('settings.manage')).filter(([k]) => k !== 'kpi' || App.can('kpi.configure')));
      let body = '';
      if (tab.cur === 'overview') {
        const ups = App.data.uploads; const last = ups.slice().sort((a, b) => (b.uploadedAt || '').localeCompare(a.uploadedAt || ''))[0];
        const records = Object.values(App.data.perf).reduce((s, d) => s + (d.rows || []).length, 0);
        body = `<div class="kpis">${[['Total Customers', App.data.customers.length, 'master'], ['Total Projects', App.data.projects.length, 'project'], ['Active Users', '<span id="ov-users">…</span>', 'users'], ['Total Data Records', records.toLocaleString('id-ID'), 'file'], ['Last Upload', last ? dt(last.uploadedAt).slice(0, 10) : '–', 'upload'], ['Failed / Rejected Upload', ups.filter(u => u.status === 'Error' || u.status === 'Rejected').length, 'alert']].map(([l, v, ic]) => `<div class="kpi st-info"><div class="lbl">${U.icon(ic)}${l}</div><div class="val">${v}</div><div class="meta"></div></div>`).join('')}</div>
          <div class="grid">${U.card('Quick Action', `<div class="row">${App.can('customer.manage') ? `<button class="btn" data-qa="customer">${U.icon('plus')} Create Customer</button>` : ''}${App.can('project.manage') ? `<button class="btn" data-qa="project">${U.icon('plus')} Create Project</button>` : ''}${App.can('user.manage') ? `<button class="btn" data-qa="user">${U.icon('plus')} Create User</button>` : ''}${App.can('template.download') ? `<button class="btn" data-qa="template">${U.icon('download')} Download Template</button>` : ''}${App.can('upload.data') ? `<button class="btn" data-qa="upload">${U.icon('upload')} Upload Data</button>` : ''}${App.can('kpi.configure') ? `<button class="btn" data-qa="kpi">${U.icon('settings')} Configure KPI</button>` : ''}</div>`, { span: 's12' })}
          ${U.card('System Activity', App.can('audit.view') ? U.chartBox('ov-act') : U.empty('Butuh akses audit log', ''), { span: 's8', hint: 'Aktivitas 14 hari terakhir' })}
          ${U.card('Status platform', `<dl class="kv"><dt>Mode</dt><dd>${App.ds.mode === 'firebase' ? 'Firebase (produksi)' : 'Demo (lokal)'}</dd><dt>Firebase project</dt><dd class="mono">${esc(window.APP_CONFIG.firebase.projectId)}</dd><dt>Data awal</dt><dd>${esc(window.SEED ? window.SEED.generatedAt.slice(0, 10) : '–')}</dd><dt>Template</dt><dd>${C.TEMPLATE_COLUMNS.length} kolom</dd><dt>Session timeout</dt><dd>${window.APP_CONFIG.sessionTimeoutMinutes} menit</dd></dl>`, { span: 's4' })}</div>`;
      } else if (tab.cur === 'kpi') {
        body = U.card('Target KPI per project', `<p class="muted small" style="margin-top:0">Target dapat berbeda antar project. Perubahan langsung dipakai oleh status, alert, dan report.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th>${KPI_FIELDS.map(f => `<th class="r">${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${App.projectsInScope().map(p => { const t = App.targets(p.id); return `<tr data-kp="${p.id}"><td><b>${esc(p.code)}</b></td>${KPI_FIELDS.map(([k]) => `<td><input class="input mono" style="width:80px;height:32px;text-align:right" type="number" step="0.1" min="0" data-k="${k}" value="${t[k]}" aria-label="${k} ${esc(p.code)}"></td>`).join('')}<td><button class="btn sm" data-ksave="${p.id}">Simpan</button></td></tr>`; }).join('')}</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn primary" id="k-all">Simpan semua</button></div>`);
      } else if (tab.cur === 'formula') {
        const F = App.F();
        const sel = (id, opts, cur) => `<select class="input" id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
        body = U.card('Konfigurasi formula auto-calculation', `<div class="form-grid">
          <div class="field"><label for="fx-acc">Accepted Call</label>${sel('fx-acc', [['true', 'Accepted Call = ACD Call'], ['false', 'Pakai nilai upload (fallback ACD)']], F.acceptedFromAcd)}</div>
          <div class="field"><label for="fx-scr">Sumber SCR harian</label>${sel('fx-scr', [['uploaded', 'Nilai SCR yang di-upload'], ['computed', 'Hitung: ACD ÷ Call Offered × 100%']], F.scrSource)}</div>
          <div class="field"><label for="fx-agg">Agregasi SCR multi-hari / multi-project</label>${sel('fx-agg', [['weighted', 'Tertimbang volume (Σ ACD ÷ Σ Offered)'], ['average', 'Rata-rata harian']], F.scrAggregate)}</div>
          <div class="field"><label for="fx-dig">Total Digital</label>${sel('fx-dig', [['computed', 'Hitung: jumlah 15 channel digital'], ['uploaded', 'Pakai nilai upload']], F.totalDigital)}</div>
          <div class="field"><label for="fx-tt">Total Traffic All</label>${sel('fx-tt', [['computed', 'Hitung: Accepted + Outbound + Total Digital'], ['uploaded', 'Pakai nilai upload']], F.totalTraffic)}</div>
          <div class="field"><label for="fx-band">Batas "At Risk" (poin % di bawah target)</label><input class="input" type="number" step="0.5" min="0" id="fx-band" value="${F.atRiskBand}"></div>
          <div class="field"><label for="fx-aht">Batas "At Risk" AHT/RT (% di atas target)</label><input class="input" type="number" step="1" min="0" id="fx-aht" value="${F.ahtRiskPct}"></div>
          <div class="field"><label for="fx-qe">Quality: Excellent ≥</label><input class="input" type="number" step="0.5" id="fx-qe" value="${F.qualityExcellent}"></div>
          <div class="field"><label for="fx-qg">Quality: Good ≥</label><input class="input" type="number" step="0.5" id="fx-qg" value="${F.qualityGood}"></div></div>
          <p class="muted small">Abandon Rate = Abandon ÷ Call Offered × 100%. Kehadiran dan Ketepatan Login diisi sebagai persentase hasil (hadir ÷ terjadwal, login tepat waktu ÷ schedule).</p>
          <div class="row"><button class="btn primary" id="fx-save">Simpan formula</button></div>`);
      } else {
        body = `<div class="grid">${App.ds.mode === 'firebase' ? U.card('Import data awal', `<p style="margin-top:0">Menulis data asli dari file Excel yang diberikan (${window.SEED.projects.length} project, ${Object.values(window.SEED.months).reduce((a, r) => a + r.length, 0).toLocaleString('id-ID')} baris harian, skor QM ${window.SEED.agents.length} agent) ke Firestore. Data dengan ID yang sama akan ditimpa.</p><div class="progress" style="margin-bottom:12px"><i id="seed-bar"></i></div>${App.isSuper() ? `<button class="btn primary" id="seed-run">${U.icon('upload')} Import ke Firestore</button>` : '<p class="muted">Hanya Super Admin.</p>'}`, { span: 's6' })
          : U.card('Data demo', `<p style="margin-top:0">Data demo tersimpan di browser ini. Reset untuk mengembalikan data awal (dari file Excel yang diberikan), user demo, dan menghapus upload percobaan.</p><button class="btn danger" id="demo-reset">${U.icon('refresh')} Reset data demo</button>`, { span: 's6' })}
          ${U.card('Pembersihan data awal', `<dl class="kv"><dt>Tanggal tertukar (hari/bulan) diperbaiki</dt><dd>${window.SEED.cleaning.datesFixed}</dd><dt>Respon Rate tidak valid (&gt;100) dikosongkan</dt><dd>${window.SEED.cleaning.rr_invalid}</dd><dt>Response time &gt; 48 jam dikosongkan</dt><dd>${window.SEED.cleaning.rt_out}</dd><dt>SCR skala 0-10000 dinormalisasi</dt><dd>${window.SEED.cleaning.scr_scaled}</dd><dt>Interaksi TikTok (tidak ada di template)</dt><dd>${window.SEED.cleaning.tiktokExcluded.toLocaleString('id-ID')} tidak dihitung</dd></dl>`, { span: 's6' })}</div>`;
      }
      return U.pageHead('Super Admin Panel', 'System Settings', '') + tab.html + body;
    },
    async mount() {
      const App = A(); const cur = App.subTab.settings || 'overview'; const g = id => document.getElementById(id);
      if (cur === 'overview') {
        document.querySelectorAll('[data-qa]').forEach(b => b.addEventListener('click', () => { const a = b.dataset.qa; if (a === 'customer') customerForm(null); else if (a === 'project') projectForm(null); else if (a === 'user') { App.subTab.users = 'list'; App.go('users'); setTimeout(() => userForm(null), 200); } else if (a === 'template' || a === 'upload') { App.subTab.upload = 'center'; App.go('upload'); } else { App.subTab.settings = 'kpi'; App.render(); } }));
        App.ds.listUsers().then(u => { const e = g('ov-users'); if (e) e.textContent = u.filter(x => x.status === 'active').length; }).catch(() => { const e = g('ov-users'); if (e) e.textContent = '–'; });
        if (App.can('audit.view') && g('ov-act')) { const log = await App.ds.listAudit(1000).catch(() => []); const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(Date.now() - i * 86400000); days.push(C.toISO(d)); } const cnt = d => log.filter(l => (l.at || '').slice(0, 10) === d); const pal = U.palette(); U.chart('ov-act', 'bar', { labels: days.map(d => d.slice(5)), datasets: [{ label: 'Login', data: days.map(d => cnt(d).filter(l => l.activity === 'Login').length), backgroundColor: pal[0], stack: 'a' }, { label: 'Upload', data: days.map(d => cnt(d).filter(l => /Upload/.test(l.activity)).length), backgroundColor: pal[1], stack: 'a' }, { label: 'Lainnya', data: days.map(d => cnt(d).filter(l => l.activity !== 'Login' && !/Upload/.test(l.activity)).length), backgroundColor: pal[4], stack: 'a' }] }, { scales: { x: { stacked: true }, y: { stacked: true, ticks: { precision: 0 } } } }); }
      } else if (cur === 'kpi') {
        const read = pid => { const tr = document.querySelector(`[data-kp="${pid}"]`); const o = {}; let bad = false; tr.querySelectorAll('[data-k]').forEach(i => { const v = parseFloat(i.value); if (!C.isNum(v) || v < 0 || (['scr', 'sl', 'quality', 'pk', 'productivity', 'attendance', 'login', 'rr'].includes(i.dataset.k) && v > 100)) { bad = true; i.setAttribute('aria-invalid', 'true'); } else { i.removeAttribute('aria-invalid'); o[i.dataset.k] = v; } }); return bad ? null : o; };
        const save = async pid => { const o = read(pid); if (!o) { U.toast(`Target ${App.proj(pid).code} tidak valid (persentase 0-100).`, 'bad'); return false; } const old = App.targets(pid); await App.ds.saveKpiTarget(pid, o); App.data.kpi[pid] = o; const ch = KPI_FIELDS.filter(([k]) => old[k] !== o[k]).map(([k, l]) => `${l}: ${old[k]} → ${o[k]}`); if (ch.length) await App.audit('Change Target', ch.join(', '), pid); return true; };
        document.querySelectorAll('[data-ksave]').forEach(b => b.addEventListener('click', async () => { if (await save(b.dataset.ksave)) U.toast('Target tersimpan.', 'ok'); }));
        g('k-all').addEventListener('click', async () => { let ok = true; for (const p of App.projectsInScope()) ok = (await save(p.id)) && ok; if (ok) U.toast('Semua target tersimpan.', 'ok'); App._alerts = null; });
      } else if (cur === 'formula') {
        g('fx-save').addEventListener('click', async () => {
          const F = { acceptedFromAcd: val(document, 'fx-acc') === 'true', scrSource: val(document, 'fx-scr'), scrAggregate: val(document, 'fx-agg'), totalDigital: val(document, 'fx-dig'), totalTraffic: val(document, 'fx-tt'), atRiskBand: parseFloat(val(document, 'fx-band')) || 0, ahtRiskPct: parseFloat(val(document, 'fx-aht')) || 0, qualityExcellent: parseFloat(val(document, 'fx-qe')) || 95, qualityGood: parseFloat(val(document, 'fx-qg')) || 85 };
          if (F.qualityGood >= F.qualityExcellent) return U.toast('Batas Good harus lebih kecil dari Excellent.', 'bad');
          try { await App.ds.saveSetting('formulas', F); App.data.settings.formulas = F; App.rebuildRows(); await App.audit('Change KPI', 'Formula: ' + Object.entries(F).map(([k, v]) => k + '=' + v).join(', ')); U.toast('Formula tersimpan. Semua dashboard dihitung ulang.', 'ok'); } catch (e) { U.toast(e.message, 'bad'); }
        });
      } else {
        if (g('seed-run')) g('seed-run').addEventListener('click', async () => { if (!await U.confirmBox('Import data awal', 'Tulis data awal ke Firestore? Dokumen dengan ID yang sama akan ditimpa.', 'Import', false)) return; const b = g('seed-run'); b.disabled = true; try { const r = await App.ds.importSeed(window.SEED, p => { const bar = g('seed-bar'); if (bar) bar.style.width = Math.round(p * 100) + '%'; }); await App.audit('Upload Excel', `Import data awal: ${r.docs} dokumen`); U.toast('Import selesai. Memuat ulang data…', 'ok'); await App.loadAll(); App.render(); } catch (e) { U.toast('Import gagal: ' + e.message, 'bad'); b.disabled = false; } });
        if (g('demo-reset')) g('demo-reset').addEventListener('click', async () => { if (!await U.confirmBox('Reset data demo', 'Kembalikan seluruh data demo ke kondisi awal? Anda akan logout.', 'Reset')) return; await App.ds.resetDemo(); });
      }
    }
  };
})();

</script>
<script>/* js/app.js */
/* =========================================================================
 * APP: bootstrap, autentikasi, shell (sidebar/topbar), router, filter global,
 * state data terpusat & RBAC. Semua halaman membaca data lewat App.rows().
 * ========================================================================= */
(function () {
  'use strict';
  const C = window.Core, U = window.UI, esc = C.esc, cfg = window.APP_CONFIG;
  const Pages = window.Pages = window.Pages || {};

  const NAV = [
    ['Dashboard', ['exec', 'portfolio', 'project', 'channel', 'traffic', 'sla', 'quality', 'workforce', 'digital']],
    ['Data', ['master', 'upload', 'reports']],
    ['Administrasi', ['users', 'access', 'audit', 'settings']]
  ];

  const App = window.App = {
    ds: null, profile: null, perms: new Set(), scopeIds: null,
    data: { customers: [], projects: [], kpi: {}, settings: { formulas: C.DEFAULT_FORMULAS, permissions: C.DEFAULT_ROLE_PERMS }, perf: {}, agents: [], uploads: [], issues: [], allRows: [] },
    filter: { customer: '', project: '', month: '', from: '', to: '', channel: '' },
    route: 'exec', subTab: {},

    /* ---------- RBAC ---------- */
    can(p) { return this.perms.has(p); },
    isCorporate() { return !!(this.profile && C.ROLES[this.profile.role] && C.ROLES[this.profile.role].all); },
    isSuper() { return this.profile && this.profile.role === 'super_admin'; },
    computeScope() {
      const p = this.profile; if (!p) return;
      const rp = (this.data.settings.permissions || C.DEFAULT_ROLE_PERMS)[p.role] || [];
      this.perms = new Set(p.role === 'super_admin' ? C.PERMISSIONS.map(x => x[0]) : rp);
      if (this.isCorporate()) this.scopeIds = null;
      else {
        const ids = new Set([].concat(p.projects || [], p.projectAccess || []));
        (p.customers || []).forEach(cid => this.data.projects.filter(x => x.customerId === cid).forEach(x => ids.add(x.id)));
        this.scopeIds = [...ids];
      }
    },
    projectsInScope() { return this.data.projects.filter(p => !this.scopeIds || this.scopeIds.includes(p.id)).sort((a, b) => a.name.localeCompare(b.name)); },
    customersInScope() { const ids = new Set(this.projectsInScope().map(p => p.customerId)); return this.data.customers.filter(c => this.isCorporate() || ids.has(c.id)).sort((a, b) => a.name.localeCompare(b.name)); },
    proj(id) { return this.data.projects.find(p => p.id === id) || { id, name: id, code: id, customerId: '' }; },
    cust(id) { return this.data.customers.find(c => c.id === id) || { id, name: id || '–' }; },
    targets(pid) { return Object.assign({}, C.DEFAULT_KPI, this.data.kpi[pid] || {}); },
    F() { return Object.assign({}, C.DEFAULT_FORMULAS, this.data.settings.formulas || {}); },

    /* ---------- DATA ---------- */
    async loadAll() {
      const ds = this.ds;
      const [customers, projects, kpi, settings] = await Promise.all([ds.listCustomers(), ds.listProjects(), ds.getKpiTargets(), ds.getSettings()]);
      Object.assign(this.data, { customers, projects, kpi, settings });
      this.computeScope();
      const ids = this.scopeIds;
      const [perf, agents, issues] = await Promise.all([ds.loadPerformance(ids), ds.loadAgents(ids).catch(() => []), ds.listIssues(ids).catch(() => [])]);
      this.data.perf = perf; this.data.agents = agents; this.data.issues = issues;
      this.data.uploads = (this.can('upload.data') || this.can('upload.approve') || this.isCorporate()) ? await ds.listUploads(ids).catch(() => []) : [];
      this.rebuildRows();
    },
    rebuildRows() {
      const F = this.F(); const out = [];
      Object.values(this.data.perf).forEach(doc => {
        if (this.scopeIds && !this.scopeIds.includes(doc.projectId)) return;
        const p = this.proj(doc.projectId);
        (doc.rows || []).forEach(r => { const x = C.computeRow(r, F); x.projectId = doc.projectId; x.customerId = p.customerId; x.ym = r.date.slice(0, 7); out.push(x); });
      });
      out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      this.data.allRows = out;
      this._alerts = null;
    },
    months() { return [...new Set(this.data.allRows.map(r => r.ym))].sort(); },
    // opts: {ignoreProject, ignoreCustomer, ignoreMonth, ignoreDate, ignoreChannel, projectIds}
    rows(opts = {}) {
      const f = this.filter; let rows = this.data.allRows;
      rows = rows.filter(r => {
        if (opts.projectIds && !opts.projectIds.includes(r.projectId)) return false;
        if (!opts.ignoreCustomer && f.customer && r.customerId !== f.customer) return false;
        if (!opts.ignoreProject && f.project && r.projectId !== f.project) return false;
        if (!opts.ignoreMonth && f.month && r.ym !== f.month) return false;
        if (!opts.ignoreDate && f.from && r.date < f.from) return false;
        if (!opts.ignoreDate && f.to && r.date > f.to) return false;
        return true;
      });
      if (!opts.ignoreChannel && f.channel) {
        const ch = f.channel;
        rows = rows.map(r => {
          const x = Object.assign({}, r);
          if (ch === 'inbound') { x.totdigUsed = 0; x.trafficUsed = r.acc || 0; x.ob = 0; CHS.forEach(c => x[c] = 0); }
          else if (ch === 'outbound') { x.totdigUsed = 0; x.trafficUsed = r.ob || 0; x.acc = 0; CHS.forEach(c => x[c] = 0); }
          else if (ch === 'digital') { x.trafficUsed = r.totdigUsed; }
          else { CHS.forEach(c => { if (c !== ch) x[c] = 0; }); x.totdigUsed = r[ch] || 0; x.trafficUsed = x.totdigUsed; }
          return x;
        });
      }
      return rows;
    },
    agg(rows) { return C.aggregate(rows, this.F()); },
    perProject(rows) {
      const g = C.groupBy(rows, r => r.projectId);
      return [...g.entries()].map(([pid, rr]) => ({ project: this.proj(pid), agg: this.agg(rr), rows: rr })).sort((a, b) => b.agg.traffic - a.agg.traffic);
    },
    series(rows, key = 'ym') { const fn = key === 'week' ? r => C.isoWeek(r.date) : key === 'date' ? r => r.date : r => r[key]; return C.series(rows, fn, this.F()); },
    // target tertimbang untuk kumpulan project (dibobot volume offered / jumlah hari)
    targetFor(rows, key) {
      const pp = this.perProject(rows); if (!pp.length) return C.DEFAULT_KPI[key];
      let w = 0, s = 0; pp.forEach(x => { const wt = key === 'scr' || key === 'sl' ? (x.agg.off || 0) : key === 'aht' ? (x.agg.acd || 0) : x.agg.days; const t = this.targets(x.project.id)[key]; if (C.isNum(t) && wt > 0) { w += wt; s += t * wt; } });
      if (w === 0) { const ts = pp.map(x => this.targets(x.project.id)[key]); return C.avg(ts); }
      return s / w;
    },
    alerts() {
      if (this._alerts && this._alertsKey === JSON.stringify(this.filter)) return this._alerts;
      const rows = this.rows();
      const pp = this.perProject(rows); const tg = {}; pp.forEach(x => tg[x.project.id] = this.targets(x.project.id));
      this._alerts = C.buildAlerts(pp, tg, this.F()); this._alertsKey = JSON.stringify(this.filter);
      return this._alerts;
    },
    async audit(activity, detail = '', projectId = '', status = 'Success') {
      try { await this.ds.audit({ userId: this.profile ? this.profile.id : null, userName: this.profile ? this.profile.name : '-', role: this.profile ? this.profile.role : '-', activity, detail, projectId, status }); } catch (e) { }
    },
    periodLabel() {
      const f = this.filter; if (f.from || f.to) return `${f.from || 'awal'} s/d ${f.to || 'akhir'}`;
      if (f.month) return C.ymLabel(f.month);
      const m = this.months(); return m.length ? `${C.ymLabel(m[0])} – ${C.ymLabel(m[m.length - 1])}` : 'Belum ada data';
    },
    go(route) { if (location.hash.slice(1) !== route) location.hash = route; else this.render(); },
    afterRender: [],
    onMount(fn) { this.afterRender.push(fn); }
  };
  const CHS = C.CHANNELS.map(c => c.k);

  async function boot() {

    }

  }

      <div class="field wide"><label for="f-from">Rentang tanggal</label><div class="range"><input class="input" type="date" id="f-from" value="${f.from}" aria-label="Dari tanggal"><input class="input" type="date" id="f-to" value="${f.to}" aria-label="Sampai tanggal"></div></div>
      <div class="field"><label for="f-ch">Channel</label><select class="input" id="f-ch"><option value="">Semua channel</option><option value="inbound" ${f.channel === 'inbound' ? 'selected' : ''}>Inbound (Voice)</option><option value="outbound" ${f.channel === 'outbound' ? 'selected' : ''}>Outbound</option><option value="digital" ${f.channel === 'digital' ? 'selected' : ''}>Semua Digital</option>${C.CHANNELS.map(c => `<option value="${c.k}" ${f.channel === c.k ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></div>
      <div class="btns"><button type="button" class="btn" id="f-reset">Reset Filter</button><button type="submit" class="btn primary">Apply Filter</button></div>
    </form>`;
  }
  function bindFilter() {
    const form = document.getElementById('filterForm'); if (!form) return;
    form.querySelector('#f-cust').addEventListener('change', e => {
      const cid = e.target.value; const sel = form.querySelector('#f-proj'); const cur = sel.value;
      const projs = App.projectsInScope().filter(p => !cid || p.customerId === cid);
      sel.innerHTML = `<option value="">Semua project</option>` + projs.map(p => `<option value="${p.id}" ${cur === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    });
    form.addEventListener('submit', e => {
      e.preventDefault(); const g = id => form.querySelector(id).value;
      const nf = { customer: g('#f-cust'), project: g('#f-proj'), month: g('#f-month'), from: g('#f-from'), to: g('#f-to'), channel: g('#f-ch') };
      if (nf.from && nf.to && nf.from > nf.to) { U.toast('Tanggal awal harus sebelum tanggal akhir.', 'bad'); return; }
      if (nf.project && nf.customer && App.proj(nf.project).customerId !== nf.customer) nf.project = '';
      App.filter = nf; App.render();
    });
    form.querySelector('#f-reset').addEventListener('click', () => { App.filter = { customer: '', project: '', month: '', from: '', to: '', channel: '' }; App.render(); });
  }

  /* =================== RENDER ROUTE =================== */
  App.render = function () {
    const content = document.getElementById('content'); if (!content) return;
    U.destroyCharts(); App.afterRender = [];
    let r = App.route; if (!allowedRoute(r)) { r = App.route = firstAllowed(); }
    const pg = Pages[r];
    document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.route === r));
    const crumb = document.querySelector('.crumb .corp'); if (crumb) crumb.textContent = `${cfg.corporateName} · ${pg.title}`;
    const f = App.filter;
    const ap = document.getElementById('activeProj');
    if (ap) ap.textContent = f.project ? App.proj(f.project).name : f.customer ? App.cust(f.customer).name : (App.scopeIds ? `${App.scopeIds.length} project ditugaskan` : `Semua project (${App.projectsInScope().length})`);
    const bell = document.getElementById('bellCount');
    if (bell) { const n = App.can('dashboard.view') ? App.alerts().length : 0; bell.hidden = !n; bell.textContent = n > 99 ? '99+' : n; }
    const banner = App.ds.mode === 'demo' ? `<div class="demo-banner">${U.icon('info')}<span><b>Mode demo</b>: perubahan tersimpan di browser ini saja. Deploy ke Firebase untuk penyimpanan bersama, autentikasi, dan audit terpusat.</span>${(() => { try { return localStorage.getItem('ccpm-force-demo') === '1' ? '<button class="btn sm" id="useFbBtn">Gunakan Firebase</button>' : ''; } catch (e) { return ''; } })()}</div>` : '';
    let html = '';
    try { html = pg.render(); } catch (e) { console.error(e); html = U.empty('Halaman gagal dimuat', e.message); }
    content.innerHTML = banner + (pg.filters ? filterBar() : '') + html;
    bindFilter();
    const fb = document.getElementById('useFbBtn'); if (fb) fb.addEventListener('click', () => { try { localStorage.removeItem('ccpm-force-demo'); } catch (e) { } location.reload(); });
    try { pg.mount && pg.mount(); App.afterRender.forEach(fn => fn()); } catch (e) { console.error(e); U.toast('Sebagian komponen gagal dimuat: ' + e.message, 'bad'); }
    content.scrollTop = 0; window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (Pages[r] && App.profile) { App.route = r; App.render(); } });
  // tab helper for pages
  App.tabs = (key, tabs) => { const cur = App.subTab[key] || tabs[0][0]; return { cur, html: `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${cur === k ? 'active' : ''}" role="tab" aria-selected="${cur === k}" data-tabkey="${key}" data-tab="${k}">${esc(l)}</button>`).join('')}</div>` }; };
  document.addEventListener('click', e => { const t = e.target.closest('[data-tabkey]'); if (t) { App.subTab[t.dataset.tabkey] = t.dataset.tab; App.render(); } });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>

</body>
</html>
