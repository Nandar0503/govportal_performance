    totdig: { label: 'Total Digital', icon: 'digital', fmt: C.fmtCompact },
    scr: { label: 'SCR', icon: 'sla', fmt: v => C.fmtPct(v), t: 'scr', hi: true },
    sl: { label: 'Service Level', icon: 'sla', fmt: v => C.fmtPct(v), t: 'sl', hi: true },
    aht: { label: 'AHT', icon: 'clock', fmt: C.fmtSec, t: 'aht', hi: false },
    qs: { label: 'Quality Score', icon: 'quality', fmt: v => C.fmtNum(v, 1), t: 'quality', hi: true },
    pk: { label: 'Product Knowledge', icon: 'quality', fmt: v => C.fmtNum(v, 1), t: 'pk', hi: true },
    prod: { label: 'Productivity', icon: 'workforce', fmt: v => C.fmtPct(v), t: 'productivity', hi: true },
    att: { label: 'Attendance', icon: 'workforce', fmt: v => C.fmtPct(v), t: 'attendance', hi: true },
    login: { label: 'Login Accuracy', icon: 'clock', fmt: v => C.fmtPct(v), t: 'login', hi: true },
    rr: { label: 'Respon Rate', icon: 'digital', fmt: v => C.fmtPct(v), t: 'rr', hi: true },
    rt: { label: 'Response Time', icon: 'clock', fmt: C.fmtSec, t: 'rt', hi: false },
    ht: { label: 'Handling Time', icon: 'clock', fmt: C.fmtSec, t: 'ht', hi: false },
    abdRate: { label: 'Abandon Rate', icon: 'alert', fmt: v => C.fmtPct(v) }
  };
  // Kartu KPI dengan target/aktual/achievement + sparkline bulanan
  function kpiCards(keys, rows, a, opts = {}) {
    const App = A(); const ser = opts.spark ? App.series(rows) : null; const out = []; const sparks = [];
    keys.forEach(k => {
      const d = KPI_DEF[k]; const v = a[k]; const o = { label: d.label, value: d.fmt(v), icon: d.icon, sub: d.sub };
      if (d.t) {
        const tg = App.targetFor(rows, d.t);
        o.status = C.isNum(v) ? C.status(v, tg, d.hi, App.F()) : 'na';
        if (opts.tav) { o.target = d.fmt(tg); o.ach = C.isNum(v) && C.isNum(tg) && tg > 0 ? C.fmtPct(d.hi ? v / tg * 100 : tg / v * 100, 1) : '–'; }
        else o.sub = `Target ${d.fmt(tg)}`;
      } else o.info = true;
      if (!C.isNum(v)) { o.value = '–'; o.sub = 'Belum ada data'; }
      if (ser && ser.length > 1) { o.spark = 'sp-' + k + '-' + (opts.id || ''); sparks.push([o.spark, ser.map(s => s[k] ?? null)]); }
      out.push(U.kpi(o));
    });
    if (sparks.length) App.onMount(() => sparks.forEach(([id, vals]) => U.spark(id, vals)));
    return `<div class="kpis">${out.join('')}</div>`;
  }
  const stColor = st => U.css(st === 'ok' ? '--ok' : st === 'risk' ? '--risk' : st === 'bad' ? '--bad' : '--c5');
  const ymLabels = s => s.map(x => C.ymShort(x.key));
  const tickCompact = { ticks: { callback: v => C.fmtCompact(v) } };
  const noData = (msg) => U.empty('Belum ada data untuk filter ini', msg || 'Ubah filter atau upload data melalui Data Upload Center.');
  function issueRows(rows) { return rows.filter(r => r.issue).map(r => ({ r, p: A().proj(r.projectId) })); }
  function issueCategory(t) {
    const s = (t || '').toLowerCase();
    if (/sdm|agent|staff|personil/.test(s) && !/login/.test(s)) return 'SDM / Staffing';
    if (/gangguan|jaringan|intermiten|terputus|gamas|telpon|telfon|117|112|provider|telco/.test(s)) return 'Jaringan / Telco';
    if (/abd un|sistem|aplikasi|tidak tercatat|error/.test(s)) return 'Sistem / Pencatatan';
    if (/volume|lonjakan|peak|tinggi/.test(s)) return 'Lonjakan Volume';
    return 'Lainnya';
  }
  window.PH = { kpiCards, KPI_DEF, stColor, ymLabels, tickCompact, noData, issueRows, issueCategory };

  /* =================== 1. EXECUTIVE =================== */
  Pages.exec = {
    title: 'Executive Dashboard', icon: 'exec', perm: 'dashboard.view', filters: true,
    render() {
      const App = A(); const rows = App.rows(); if (!rows.length) return U.pageHead('Corporate Contact Center', 'Executive Overview', App.periodLabel()) + noData();
      const a = App.agg(rows); const pp = App.perProject(rows);
      a.projects = App.projectsInScope().filter(p => p.status === 'Active' && (!App.filter.customer || p.customerId === App.filter.customer) && (!App.filter.project || p.id === App.filter.project)).length;
      const alerts = App.alerts();
      const issues = issueRows(rows).slice(-6).reverse();
      const ups = App.data.uploads.slice(0, 5);
      const projTable = pp.map(x => { const t = App.targets(x.project.id); const st = x.agg.off > 0 ? C.status(x.agg.scr, t.scr, true, App.F()) : 'na'; return `<tr><td><b>${esc(x.project.code || x.project.name)}</b><div class="muted small">${esc(App.cust(x.project.customerId).name)}</div></td><td class="r">${C.fmtCompact(x.agg.traffic)}</td><td class="r">${x.agg.off > 0 ? C.fmtPct(x.agg.scr) : '–'}</td><td>${U.pill(st)}</td><td class="r">${C.fmtSec(x.agg.aht)}</td><td class="r">${C.fmtNum(x.agg.qs, 1)}</td></tr>`; }).join('');
      return U.pageHead('Corporate Contact Center Executive Overview', 'Executive Dashboard', `${App.periodLabel()} · ${pp.length} project dengan data`, App.can('report.export') ? `<a class="btn" href="#reports">${U.icon('report')} Report Center</a>` : '') +
        kpiCards(['projects', 'traffic', 'scr', 'sl', 'aht', 'qs', 'prod'], rows, a, { spark: true, id: 'top' }) +
        kpiCards(['off', 'totdig', 'pk', 'att', 'login'], rows, a, { spark: true, id: 'sec' }) +
        `<div class="grid">
          ${U.card('Traffic Trend', U.chartBox('ex-traffic'), { span: 's6', hint: 'Inbound accepted · Outbound · Digital' })}
          ${U.card('SCR Trend', U.chartBox('ex-scr'), { span: 's6', hint: 'Aktual vs target tertimbang' })}
          ${U.card('Digital Channel', U.chartBox('ex-digital'), { span: 's5', hint: 'Volume per channel' })}
          ${U.card('Project Performance', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th class="r">Traffic</th><th class="r">SCR</th><th>Status</th><th class="r">AHT</th><th class="r">Quality</th></tr></thead><tbody>${projTable}</tbody></table></div>`, { span: 's7' })}
          ${U.card('Quality', U.chartBox('ex-quality', 'short'), { span: 's4', hint: 'Skor QM per project' })}
          ${U.card('Workforce', U.chartBox('ex-wf', 'short'), { span: 's4', hint: 'Jumlah SDM per project' })}
          ${U.card('Top Issue', alerts.length ? alerts.slice(0, 6).map(x => `<div class="alert-row ${x.severity}"><span class="ic">${U.icon('alert')}</span><div>${esc(x.text)}</div></div>`).join('') : U.empty('Tidak ada alert', 'Semua KPI dalam target.'), { span: 's4', hint: alerts.length + ' alert aktif' })}
          ${U.card('SCR Issue', issues.length ? issues.map(({ r, p }) => `<div class="alert-row risk"><span class="ic">${U.icon('sla')}</span><div><b>${esc(p.code)}</b> · ${esc(r.date)} · SCR ${C.fmtPct(r.scrUsed)}<div class="muted small">${esc(r.issue.slice(0, 140))}${r.issue.length > 140 ? '…' : ''}</div></div></div>`).join('') : U.empty('Tidak ada issue SCR', 'Belum ada catatan issue pada periode ini.'), { span: 's6' })}
          ${U.card('Latest Update', ups.length ? ups.map(u => `<div class="alert-row info"><span class="ic">${U.icon('upload')}</span><div><b>${esc(u.projectName || u.projectId)}</b> · ${esc(u.period)}<div class="muted small">${esc(u.fileName)} · ${esc(u.status)} · ${esc((u.uploadedAt || '').slice(0, 10))}</div></div></div>`).join('') : lastDataList(pp), { span: 's6' })}
        </div>
        <div class="section-title"><h2>Corporate Performance Chart</h2><span>Perbandingan seluruh project pada periode terpilih</span></div>
        <div class="grid">
          ${U.card('Traffic by Project', U.chartBox('cp-traffic'), { span: 's6' })}
          ${U.card('Digital Interaction by Project', U.chartBox('cp-digital'), { span: 's6', hint: 'Stacked per channel' })}
          ${U.card('SCR by Project', U.chartBox('cp-scr', 'tall'), { span: 's4' })}
          ${U.card('SL by Project', U.chartBox('cp-sl', 'tall'), { span: 's4' })}
          ${U.card('Quality Score by Project', U.chartBox('cp-qs', 'tall'), { span: 's4' })}
          ${U.card('Monthly Traffic Trend', U.chartBox('cp-mt'), { span: 's6' })}
          ${U.card('SCR Trend per Project', U.chartBox('cp-st'), { span: 's6' })}
          ${U.card('AHT Trend', U.chartBox('cp-aht'), { span: 's6' })}
          ${U.card('Workforce Trend', U.chartBox('cp-wf'), { span: 's6', hint: 'Kehadiran & Quality bulanan' })}
        </div>`;
    },
    mount() {
      const App = A(); const rows = App.rows(); if (!rows.length) return;
      const pal = U.palette(); const ser = App.series(rows); const pp = App.perProject(rows); const F = App.F();
      U.chart('ex-traffic', 'bar', { labels: ymLabels(ser), datasets: [
        { label: 'Inbound', data: ser.map(s => s.acc), backgroundColor: pal[0], stack: 't', borderRadius: 3 },
        { label: 'Outbound', data: ser.map(s => s.ob), backgroundColor: pal[3], stack: 't', borderRadius: 3 },
        { label: 'Digital', data: ser.map(s => s.totdig), backgroundColor: pal[1], stack: 't', borderRadius: 3 }] }, { scales: { x: { stacked: true }, y: Object.assign({ stacked: true }, tickCompact) } });
      const tScr = App.targetFor(rows, 'scr');

    title: 'Traffic Analytics', icon: 'traffic', perm: 'dashboard.view', filters: true,
    render() {
      const App = A(); const rows = App.rows(); if (!rows.length) return U.pageHead('Traffic', 'Traffic Analytics', App.periodLabel()) + noData();
      const a = App.agg(rows);
      const tab = App.tabs('traffic', [['volume', 'Volume & Tren'], ['reason', 'Customer Contact Reason'], ['category', 'Top Category Analytics']]);
      let body = '';
      if (tab.cur === 'volume') body = `<div class="section-title"><h2>Inbound</h2></div>` + kpiCards(['off', 'acc', 'abd', 'abdRate', 'aht', 'cmin', 'scr', 'sl'], rows, a) +
        `<div class="section-title"><h2>Outbound & Digital</h2></div>` + kpiCards(['ob', 'totdig', 'traffic'], rows, a) +
        `<div class="grid">
          ${U.card('Hourly Traffic', `<p class="muted small" style="margin:0 0 8px">Template harian belum memuat data interval per jam. Grafik menampilkan pola rata-rata per hari dalam seminggu.</p>${U.chartBox('tr-dow', 'short')}`, { span: 's4' })}
          ${U.card('Daily Traffic', U.chartBox('tr-daily'), { span: 's8' })}
          ${U.card('Weekly Traffic', U.chartBox('tr-week'), { span: 's6' })}
          ${U.card('Monthly Traffic', U.chartBox('tr-month'), { span: 's6' })}
          ${U.card('Channel Distribution', U.chartBox('tr-ch'), { span: 's6' })}
          ${U.card('Project Distribution', U.chartBox('tr-proj'), { span: 's6' })}
        </div>`;
      else if (tab.cur === 'reason') {
        const tot = a.info + a.perm + a.komp + a.nonp;
        body = (tot ? `<div class="kpis">${[['Informasi', a.info], ['Permintaan', a.perm], ['Komplain', a.komp], ['Non Pengaduan', a.nonp]].map(([l, v]) => U.kpi({ label: l, value: C.fmtCompact(v), info: true, sub: C.fmtPct(v / tot * 100) + ' kontribusi' })).join('')}</div>
          <div class="grid">${U.card('Kontribusi kategori', U.chartBox('rs-donut'), { span: 's4' })}${U.card('Kategori per project', U.chartBox('rs-stack'), { span: 's8' })}${U.card('Tren kategori bulanan', U.chartBox('rs-trend'), { span: 's12' })}</div>` : noData('Kolom Informasi / Permintaan / Komplain / Non Pengaduan belum terisi.'));
      } else {
        body = `<div class="grid">${U.card('Ranking kategori berdasarkan volume', '<div id="tc-table"></div>', { span: 's7', hint: 'Bobot: Top 1 = 3, Top 2 = 2, Top 3 = 1 per hari' })}${U.card('Kontribusi kategori teratas', U.chartBox('tc-chart', 'tall'), { span: 's5' })}${U.card('Perbandingan antar project', '<div id="tc-proj"></div>', { span: 's12' })}${U.card('Tren kategori teratas', U.chartBox('tc-trend'), { span: 's12' })}</div>`;
      }
      return U.pageHead('Traffic Analytics', 'Traffic Analytics', App.periodLabel()) + tab.html + body;
    },
    mount() {
      const App = A(); const rows = App.rows(); if (!rows.length) return; const pal = U.palette(); const cur = App.subTab.traffic || 'volume';
      if (cur === 'volume') {
        const dow = C.DAYS_ID.map((d, i) => { const rr = rows.filter(r => new Date(r.date + 'T00:00:00').getDay() === i); const days = new Set(rr.map(r => r.date)).size; return { d, v: days ? rr.reduce((s, r) => s + r.trafficUsed, 0) / days : 0 }; });
        const order = [1, 2, 3, 4, 5, 6, 0];
        U.chart('tr-dow', 'bar', { labels: order.map(i => dow[i].d.slice(0, 3)), datasets: [{ label: 'Rata-rata traffic/hari', data: order.map(i => dow[i].v), backgroundColor: pal[0], borderRadius: 4 }] }, { scales: { y: tickCompact } });
        const d = App.series(rows, 'date');
        U.chart('tr-daily', 'line', { labels: d.map(x => x.key.slice(5)), datasets: [{ label: 'Inbound', data: d.map(x => x.acc), borderColor: pal[0], pointRadius: 0, tension: .2 }, { label: 'Digital', data: d.map(x => x.totdig), borderColor: pal[1], pointRadius: 0, tension: .2 }, { label: 'Outbound', data: d.map(x => x.ob), borderColor: pal[3], pointRadius: 0, tension: .2 }] }, { scales: { y: tickCompact } });
        const w = App.series(rows, 'week');
        U.chart('tr-week', 'bar', { labels: w.map(x => x.key.slice(5)), datasets: [{ label: 'Total traffic', data: w.map(x => x.traffic), backgroundColor: pal[2], borderRadius: 3 }] }, { scales: { y: tickCompact } });
        const m = App.series(rows);
        U.chart('tr-month', 'bar', { labels: ymLabels(m), datasets: [{ label: 'Inbound', data: m.map(x => x.acc), backgroundColor: pal[0], stack: 'm' }, { label: 'Outbound', data: m.map(x => x.ob), backgroundColor: pal[3], stack: 'm' }, { label: 'Digital', data: m.map(x => x.totdig), backgroundColor: pal[1], stack: 'm' }] }, { scales: { x: { stacked: true }, y: Object.assign({ stacked: true }, tickCompact) } });
        const a = App.agg(rows); const parts = [['Inbound', a.acc], ['Outbound', a.ob]].concat(C.CHANNELS.map(c => [c.label, a[c.k]])).filter(x => x[1] > 0).sort((x, y) => y[1] - x[1]);
        U.chart('tr-ch', 'doughnut', { labels: parts.map(x => x[0]), datasets: [{ data: parts.map(x => x[1]), backgroundColor: parts.map((_, i) => pal[i % pal.length]), borderWidth: 0 }] }, { cutout: '58%', plugins: { legend: { position: 'right' } } });
        const pp = App.perProject(rows);
        U.chart('tr-proj', 'bar', { labels: pp.map(x => x.project.code), datasets: [{ label: 'Traffic', data: pp.map(x => x.agg.traffic), backgroundColor: pal[0], borderRadius: 4 }] }, { scales: { y: tickCompact } });
      } else if (cur === 'reason') {
        const a = App.agg(rows); if (!(a.info + a.perm + a.komp + a.nonp)) return;
        const K = [['info', 'Informasi'], ['perm', 'Permintaan'], ['komp', 'Komplain'], ['nonp', 'Non Pengaduan']];
        U.chart('rs-donut', 'doughnut', { labels: K.map(k => k[1]), datasets: [{ data: K.map(k => a[k[0]]), backgroundColor: pal.slice(0, 4), borderWidth: 0 }] }, { cutout: '62%' });
        const pp = App.perProject(rows).filter(x => x.agg.info + x.agg.perm + x.agg.komp + x.agg.nonp > 0);
        U.chart('rs-stack', 'bar', { labels: pp.map(x => x.project.code), datasets: K.map((k, i) => ({ label: k[1], data: pp.map(x => x.agg[k[0]]), backgroundColor: pal[i], stack: 'r' })) }, { scales: { x: { stacked: true }, y: Object.assign({ stacked: true }, tickCompact) } });
        const s = App.series(rows);
        U.chart('rs-trend', 'line', { labels: ymLabels(s), datasets: K.map((k, i) => ({ label: k[1], data: s.map(x => x[k[0]]), borderColor: pal[i], tension: .3 })) }, { scales: { y: tickCompact } });
      } else {
        const cat = {}; rows.forEach(r => [['top1', 3], ['top2', 2], ['top3', 1]].forEach(([k, w]) => { const t = r[k]; if (!t) return; const key = t.trim(); const c = cat[key] = cat[key] || { name: key, score: 0, days: 0, projects: new Set(), byMonth: {} }; c.score += w; c.days++; c.projects.add(r.projectId); c.byMonth[r.ym] = (c.byMonth[r.ym] || 0) + w; }));
        const list = Object.values(cat).sort((a, b) => b.score - a.score); const total = list.reduce((s, c) => s + c.score, 0);
        if (!list.length) { document.getElementById('tc-table').innerHTML = U.empty('Belum ada data Top Kategori', 'Isi kolom Top Kategori 1-3 pada template.'); return; }
        U.dataTable('tc-table', [{ k: 'rank', label: '#', r: 1 }, { k: 'name', label: 'Kategori', wrap: 1 }, { k: 'score', label: 'Skor', r: 1, fmt: C.fmtInt }, { k: 'pct', label: '%', r: 1, fmt: v => C.fmtPct(v) }, { k: 'days', label: 'Hari muncul', r: 1 }, { k: 'proj', label: 'Project', fmt: v => v.map(id => `<span class="tag">${esc(App.proj(id).code)}</span>`).join('') }],
          list.map((c, i) => ({ rank: i + 1, name: c.name, score: c.score, pct: c.score / total * 100, days: c.days, proj: [...c.projects] })), { pageSize: 10 });
        const top = list.slice(0, 8);
        U.chart('tc-chart', 'bar', { labels: top.map(c => c.name.length > 38 ? c.name.slice(0, 36) + '…' : c.name), datasets: [{ label: '% kontribusi', data: top.map(c => c.score / total * 100), backgroundColor: pal[2], borderRadius: 4 }] }, { indexAxis: 'y', scales: { y: { grid: { display: false }, ticks: { font: { size: 10 } } } } });
        const pp = App.perProject(rows).map(x => { const c = {}; x.rows.forEach(r => [['top1', 3], ['top2', 2], ['top3', 1]].forEach(([k, w]) => { if (r[k]) c[r[k]] = (c[r[k]] || 0) + w; })); const best = Object.entries(c).sort((a, b) => b[1] - a[1]); return { code: x.project.code, n: best.length, c1: best[0] ? best[0][0] : '–', c2: best[1] ? best[1][0] : '–', c3: best[2] ? best[2][0] : '–' }; }).filter(x => x.n);
        U.dataTable('tc-proj', [{ k: 'code', label: 'Project' }, { k: 'c1', label: 'Kategori #1', wrap: 1 }, { k: 'c2', label: 'Kategori #2', wrap: 1 }, { k: 'c3', label: 'Kategori #3', wrap: 1 }], pp, { noPaging: true, search: false });
        const months = App.months().filter(m => rows.some(r => r.ym === m));
        U.chart('tc-trend', 'line', { labels: months.map(C.ymShort), datasets: list.slice(0, 5).map((c, i) => ({ label: c.name.length > 40 ? c.name.slice(0, 38) + '…' : c.name, data: months.map(m => c.byMonth[m] || 0), borderColor: pal[i], tension: .3 })) });
      }
    }
  };
})();

</script>
<script>/* js/pages-ops.js */
/* =========================================================================
 * HALAMAN OPERASIONAL: SLA & SCR, Quality, Workforce, Digital Channel
 * ========================================================================= */
(function () {
  'use strict';
  const C = window.Core, U = window.UI, esc = C.esc;
  const Pages = window.Pages = window.Pages || {};
  const A = () => window.App; const PH = () => window.PH;

  /* =================== 6. SLA & SERVICE LEVEL =================== */
  const ISSUE_CATS = ['Jaringan / Telco', 'Sistem / Pencatatan', 'SDM / Staffing', 'Lonjakan Volume', 'Lainnya'];
  function issueList(rows) {
    const App = A(); const stored = new Map(App.data.issues.map(i => [i.id, i]));
    return rows.filter(r => r.issue).map(r => {
      const id = r.projectId + '_' + r.date; const s = stored.get(id) || {}; const t = C.isNum(r.tscr) ? r.tscr : App.targets(r.projectId).scr;
      return { id, projectId: r.projectId, code: App.proj(r.projectId).code, date: r.date, scr: r.scrUsed, target: t, gap: C.isNum(r.scrUsed) ? r.scrUsed - t : null, issue: r.issue, category: s.category || PH().issueCategory(r.issue), actionPlan: s.actionPlan || '', status: s.status || 'Open', updatedBy: s.updatedBy || '' };
    }).sort((a, b) => b.date.localeCompare(a.date));
  }
  Pages.sla = {
    title: 'SLA & Service Level', icon: 'sla', perm: 'dashboard.view', filters: true,
    render() {
      const App = A(); const rows = App.rows().filter(r => r.off > 0 || C.isNum(r.scr));
      if (!rows.length) return U.pageHead('SCR Performance', 'SLA & Service Level', App.periodLabel()) + PH().noData('Tidak ada data inbound/SCR pada filter ini.');
      const a = App.agg(rows); const tg = App.targetFor(rows, 'scr'); const st = C.status(a.scr, tg, true, App.F());
      const ach = C.isNum(a.scr) && tg ? a.scr / tg * 100 : null; const gap = C.isNum(a.scr) ? a.scr - tg : null;
      const pp = App.perProject(rows).filter(x => C.isNum(x.agg.scr)).sort((x, y) => x.agg.scr - y.agg.scr);
      const F = App.F(); const cnt = { ok: 0, risk: 0, bad: 0 }; pp.forEach(x => { const s = C.status(x.agg.scr, App.targets(x.project.id).scr, true, F); if (cnt[s] !== undefined) cnt[s]++; });
      const iss = issueList(App.rows());
      const below = rows.filter(r => C.isNum(r.scrUsed) && r.scrUsed < (C.isNum(r.tscr) ? r.tscr : App.targets(r.projectId).scr) && !r.issue).length;
      const mode = App.subTab.slaTrend || 'monthly';
      return U.pageHead('SCR Performance', 'SLA & Service Level', App.periodLabel()) +
        `<div class="grid">
          <section class="card s4"><div class="card-h"><h3>SCR vs Target</h3>${U.pill(st)}</div><div class="card-b"><div class="gauge"><canvas id="sla-gauge"></canvas><div class="g-val"><b>${C.fmtPct(a.scr)}</b><span>Target ${C.fmtPct(tg)}</span></div></div>
            <div class="stat-strip" style="margin-top:12px"><div><span>Target SCR</span><b>${C.fmtPct(tg)}</b></div><div><span>Actual SCR</span><b>${C.fmtPct(a.scr)}</b></div><div><span>Achievement</span><b>${C.fmtPct(ach)}</b></div><div><span>Gap</span><b style="color:var(--${gap >= 0 ? 'ok' : 'bad'})">${gap === null ? '–' : (gap >= 0 ? '+' : '') + C.fmtNum(gap, 2) + ' pt'}</b></div></div></div></section>
          ${U.card('Status SCR per project', `<div class="row small" style="margin-bottom:8px">${U.pill('ok', cnt.ok + ' Achieved')}${U.pill('risk', cnt.risk + ' At Risk')}${U.pill('bad', cnt.bad + ' Below Target')}</div>` + pp.map(x => { const t = App.targets(x.project.id).scr; const s = C.status(x.agg.scr, t, true, F); return `<div class="row" style="padding:5px 0;flex-wrap:nowrap"><b style="width:96px;flex:none;font-size:12.5px;overflow-wrap:anywhere">${esc(x.project.code)}</b>${U.barCell(x.agg.scr, 100, t, PH().stColor(s))}<span class="mono" style="width:62px;text-align:right;font-size:12.5px">${C.fmtPct(x.agg.scr)}</span>${U.pill(s)}</div>`; }).join(''), { span: 's8', hint: 'Garis tegak = target project' })}
          ${U.card('SCR Trend', `<div class="row" style="margin-bottom:8px"><button class="btn sm ${mode === 'monthly' ? 'primary' : ''}" data-sla="monthly">Bulanan</button><button class="btn sm ${mode === 'daily' ? 'primary' : ''}" data-sla="daily">Harian</button><button class="btn sm ${mode === 'weekly' ? 'primary' : ''}" data-sla="weekly">Mingguan</button></div>${U.chartBox('sla-trend', 'tall')}`, { span: 's8', hint: 'Actual line vs target line' })}
          ${U.card('Service Level by Project', U.chartBox('sla-sl', 'tall'), { span: 's4' })}
        </div>
        <div class="section-title"><h2>Issue Ketidaktercapaian SCR</h2><span>${iss.length} catatan issue${below ? ` · ${below} hari di bawah target tanpa keterangan` : ''}</span></div>
        ${U.card('', '<div id="sla-issues"></div>')}`;
    },
    mount() {
      const App = A(); const rows = App.rows().filter(r => r.off > 0 || C.isNum(r.scr)); if (!rows.length) return;
      document.querySelectorAll('[data-sla]').forEach(b => b.addEventListener('click', () => { App.subTab.slaTrend = b.dataset.sla; App.render(); }));
      const a = App.agg(rows); const tg = App.targetFor(rows, 'scr'); U.gauge('sla-gauge', a.scr, tg, C.status(a.scr, tg, true, App.F()));
      const mode = App.subTab.slaTrend || 'monthly'; const pal = U.palette();
      const s = App.series(rows, mode === 'daily' ? 'date' : mode === 'weekly' ? 'week' : 'ym');
      const lbl = s.map(x => mode === 'monthly' ? C.ymShort(x.key) : mode === 'daily' ? x.key.slice(5) : x.key.slice(5));
      U.chart('sla-trend', 'line', { labels: lbl, datasets: [{ label: 'Actual SCR', data: s.map(x => x.scr), borderColor: pal[0], backgroundColor: U.alpha(pal[0], .1), fill: true, tension: .25, pointRadius: mode === 'daily' ? 0 : 3, spanGaps: true }, { label: 'Target SCR', data: s.map(x => { const rr = rows.filter(r => (mode === 'daily' ? r.date : mode === 'weekly' ? C.isoWeek(r.date) : r.ym) === x.key); return App.targetFor(rr, 'scr'); }), borderColor: U.css('--bad'), borderDash: [6, 4], pointRadius: 0 }] }, { scales: { y: { beginAtZero: false, max: 100, ticks: { callback: v => v + '%' } } } });
      const pp = App.perProject(rows).filter(x => C.isNum(x.agg.sl)).sort((x, y) => y.agg.sl - x.agg.sl);
      U.chart('sla-sl', 'bar', { labels: pp.map(x => x.project.code), datasets: [{ label: 'SL', data: pp.map(x => x.agg.sl), backgroundColor: pp.map(x => PH().stColor(C.status(x.agg.sl, App.targets(x.project.id).sl, true, App.F()))), borderRadius: 4 }] }, { indexAxis: 'y', scales: { x: { max: 100 }, y: { grid: { display: false } } } });
      const list = issueList(App.rows()); const canEdit = App.can('issue.edit');
      U.dataTable('sla-issues', [
        { k: 'code', label: 'Project' }, { k: 'date', label: 'Date' }, { k: 'scr', label: 'SCR', r: 1, fmt: v => C.fmtPct(v) }, { k: 'target', label: 'Target', r: 1, fmt: v => C.fmtPct(v) },
        { k: 'gap', label: 'Gap', r: 1, fmt: v => C.isNum(v) ? `<span style="color:var(--${v >= 0 ? 'ok' : 'bad'})">${v >= 0 ? '+' : ''}${C.fmtNum(v, 2)}</span>` : '–' },
        { k: 'issue', label: 'Issue', wrap: 1 }, { k: 'category', label: 'Category', fmt: v => `<span class="tag">${esc(v)}</span>` }, { k: 'actionPlan', label: 'Action Plan', wrap: 1, fmt: v => esc(v || '–') },
        { k: 'status', label: 'Status', fmt: v => U.pill(v === 'Resolved' ? 'ok' : v === 'On Progress' ? 'risk' : 'bad', v) },
        { k: 'id', label: '', noSort: 1, fmt: v => canEdit ? `<button class="btn sm" data-issue="${esc(v)}">${U.icon('edit')} Kelola</button>` : '' }
      ], list, { pageSize: 10, emptyMsg: 'Belum ada catatan pada kolom "Issue Ketidak tercapaian SCR".', onRender: el => el.querySelectorAll('[data-issue]').forEach(b => b.addEventListener('click', () => editIssue(list.find(i => i.id === b.dataset.issue)))) });
    }
  };
  function editIssue(it) {
    const App = A();
    const m = U.modal({ title: `Issue SCR · ${it.code} · ${it.date}`, body: `<div class="stack"><div class="muted small">${esc(it.issue)}</div>
      <div class="form-grid"><div class="field"><label for="is-cat">Category</label><select class="input" id="is-cat">${ISSUE_CATS.map(c => `<option ${c === it.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label for="is-st">Status</label><select class="input" id="is-st">${['Open', 'On Progress', 'Resolved'].map(s => `<option ${s === it.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field full"><label for="is-ap">Action Plan</label><textarea class="input" id="is-ap" maxlength="1000">${esc(it.actionPlan)}</textarea></div></div></div>`,
      foot: `<button class="btn" data-close>Batal</button><button class="btn primary" id="is-save">Simpan</button>` });
    m.el.querySelector('#is-save').addEventListener('click', async () => {
      const rec = { id: it.id, projectId: it.projectId, date: it.date, issue: it.issue, category: m.el.querySelector('#is-cat').value, status: m.el.querySelector('#is-st').value, actionPlan: m.el.querySelector('#is-ap').value.trim(), updatedBy: App.profile.name, updatedAt: new Date().toISOString() };
      try { await App.ds.saveIssue(rec); const i = App.data.issues.findIndex(x => x.id === rec.id); if (i >= 0) App.data.issues[i] = rec; else App.data.issues.push(rec); await App.audit('Edit Data', `Issue SCR ${it.code} ${it.date} → ${rec.status}`, it.projectId); m.close(); U.toast('Issue tersimpan.', 'ok'); App.render(); }
      catch (e) { U.toast(e.message, 'bad'); }
    });
  }

  /* =================== 7. QUALITY =================== */
  function agentsInScope() {
    const App = A(); const f = App.filter; const months = new Set(App.rows().map(r => r.ym));
    const allowed = new Set(App.rows().map(r => r.projectId));
    return App.data.agents.filter(a => (!f.project || a.projectId === f.project) && (!f.customer || App.proj(a.projectId).customerId === f.customer) && (allowed.has(a.projectId) || !App.rows().length)).map(a => {
      const pick = obj => Object.entries(obj || {}).filter(([m]) => !months.size || months.has(m));
      const q = pick(a.qs); const pk = pick(a.pk); const at = pick(a.att);
      return { name: a.name, projectId: a.projectId, code: App.proj(a.projectId).code, channel: a.channel, qs: C.avg(q.map(x => x[1])), last: q.length ? q.sort()[q.length - 1][1] : null, n: q.length, pk: C.avg(pk.map(x => x[1])), att: C.avg(at.map(x => x[1])), scores: q };
    }).filter(a => a.n);
  }
  Pages.quality = {
    title: 'Quality Performance', icon: 'quality', perm: 'dashboard.view', filters: true,
    render() {
      const App = A(); const rows = App.rows(); const a = App.agg(rows); const ag = agentsInScope();
      if (!rows.length) return U.pageHead('Quality', 'Quality Performance', App.periodLabel()) + PH().noData();
      const F = App.F(); const bands = { Excellent: 0, Good: 0, 'Need Improvement': 0 };
      ag.forEach(x => x.scores.forEach(([, v]) => { bands[C.qualityBand(v, F)]++; }));
      const totB = bands.Excellent + bands.Good + bands['Need Improvement'];
      return U.pageHead('Quality Monitoring', 'Quality Performance', App.periodLabel()) +
        PH().kpiCards(['qs', 'pk', 'prod'], rows, a, { tav: true }) +
        `<div class="grid">
          ${U.card('Quality Trend per project', U.chartBox('q-trend', 'tall'), { span: 's8', hint: 'Skor QM bulanan' })}
          ${U.card('Distribusi skor agent', totB ? U.chartBox('q-dist', 'tall') : U.empty('Belum ada skor agent', ''), { span: 's4', hint: `Excellent ≥ ${F.qualityExcellent} · Good ≥ ${F.qualityGood}` })}
          ${U.card('Project Comparison', U.chartBox('q-proj'), { span: 's6', hint: 'Garis = target quality project' })}
          ${U.card('Monthly Trend (rata-rata)', U.chartBox('q-month'), { span: 's6', hint: 'Quality · Product Knowledge · Productivity' })}
          ${U.card('Agent Performance', ag.length ? '<div id="q-agents"></div>' : U.empty('Belum ada data skor per agent', 'Data agent tersedia untuk project yang memiliki rekap QM.'), { hint: `${ag.length} agent` })}
        </div>`;
    },
    mount() {
      const App = A(); const rows = App.rows(); if (!rows.length) return; const pal = U.palette(); const F = App.F();
      const months = App.months().filter(m => rows.some(r => r.ym === m)); const pp = App.perProject(rows).filter(x => C.isNum(x.agg.qs));
      U.chart('q-trend', 'line', { labels: months.map(C.ymShort), datasets: pp.map((x, i) => { const s = new Map(App.series(x.rows).map(y => [y.key, y])); return { label: x.project.code, data: months.map(m => s.get(m) ? s.get(m).qs : null), borderColor: pal[i % pal.length], tension: .3, spanGaps: true }; }) }, { scales: { y: { beginAtZero: false, suggestedMin: 75, max: 100 } } });
      const ag = agentsInScope(); const bands = { Excellent: 0, Good: 0, 'Need Improvement': 0 }; ag.forEach(x => x.scores.forEach(([, v]) => bands[C.qualityBand(v, F)]++));
      if (document.getElementById('q-dist')) U.chart('q-dist', 'doughnut', { labels: Object.keys(bands), datasets: [{ data: Object.values(bands), backgroundColor: [U.css('--ok'), U.css('--c1'), U.css('--risk')], borderWidth: 0 }] }, { cutout: '60%' });
      U.chart('q-proj', 'bar', { labels: pp.map(x => x.project.code), datasets: [{ label: 'Quality', data: pp.map(x => x.agg.qs), backgroundColor: pp.map(x => PH().stColor(C.status(x.agg.qs, App.targets(x.project.id).quality, true, F))), borderRadius: 4 }, { type: 'line', label: 'Target', data: pp.map(x => App.targets(x.project.id).quality), borderColor: U.css('--text'), showLine: false, pointStyle: 'line', pointRadius: 10 }] }, { scales: { y: { beginAtZero: false, suggestedMin: 75, max: 100 } } });
      const s = App.series(rows);
      U.chart('q-month', 'line', { labels: PH().ymLabels(s), datasets: [{ label: 'Quality', data: s.map(x => x.qs), borderColor: pal[1], tension: .3, spanGaps: true }, { label: 'Product Knowledge', data: s.map(x => x.pk), borderColor: pal[2], tension: .3, spanGaps: true }, { label: 'Productivity', data: s.map(x => x.prod), borderColor: pal[3], tension: .3, spanGaps: true }] }, { scales: { y: { beginAtZero: false, suggestedMin: 75, max: 100 } } });
      if (ag.length) U.dataTable('q-agents', [{ k: 'name', label: 'Agent' }, { k: 'code', label: 'Project' }, { k: 'channel', label: 'Channel' }, { k: 'qs', label: 'Rata-rata QM', r: 1, fmt: v => C.fmtNum(v, 2) }, { k: 'last', label: 'Bulan terakhir', r: 1, fmt: v => C.fmtNum(v, 2) }, { k: 'pk', label: 'Product Knowledge', r: 1, fmt: v => C.fmtNum(v, 1) }, { k: 'att', label: 'Kehadiran', r: 1, fmt: v => C.fmtPct(v) },
        { k: 'band', label: 'Kategori', sort: r => r.qs, fmt: (v, r) => { const b = C.qualityBand(r.qs, F); return U.pill(b === 'Excellent' ? 'ok' : b === 'Good' ? 'info' : 'risk', b); } }], ag, { sortK: 'qs', pageSize: 12 });
    }
  };

  /* =================== 8. WORKFORCE =================== */
  Pages.workforce = {
    title: 'Workforce Performance', icon: 'workforce', perm: 'dashboard.view', filters: true,
    render() {
      const App = A(); const rows = App.rows(); if (!rows.length) return U.pageHead('Workforce', 'Workforce Performance', App.periodLabel()) + PH().noData();
      const a = App.agg(rows); const pp = App.perProject(rows); const F = App.F();
      const tab = App.tabs('wf', [['wf', 'Workforce'], ['att', 'Attendance & Login Monitoring']]);
      const alerts = [];
      pp.forEach(x => { const g = x.agg, t = App.targets(x.project.id), c = x.project.code;
        if (C.isNum(g.seat) && C.isNum(g.sdm)) { if (g.sdm < g.seat * 0.9) alerts.push(['bad', `Understaffed: ${c} memiliki ${g.sdm} SDM untuk ${g.seat} seat.`]); else if (g.sdm > g.seat * 1.25) alerts.push(['risk', `Overstaffed: ${c} memiliki ${g.sdm} SDM untuk ${g.seat} seat.`]); }
        if (C.status(g.att, t.attendance, true, F) === 'bad' || C.status(g.att, t.attendance, true, F) === 'risk') alerts.push([C.status(g.att, t.attendance, true, F), `Attendance Issue: kehadiran ${c} ${C.fmtPct(g.att)} (target ${C.fmtPct(t.attendance)}).`]);
        if (['bad', 'risk'].includes(C.status(g.login, t.login, true, F))) alerts.push([C.status(g.login, t.login, true, F), `Login Compliance Issue: ketepatan login ${c} ${C.fmtPct(g.login)} (target ${C.fmtPct(t.login)}).`]);
      });
      const missing = ['seat', 'att', 'login', 'prod'].filter(k => !C.isNum(a[k])).map(k => ({ seat: 'Jumlah Seat', att: 'Kehadiran', login: 'Ketepatan Login', prod: 'Productifity Agent' }[k]));
      const note = missing.length ? `<div class="demo-banner" style="background:var(--info-soft);border-color:var(--accent-line)">${U.icon('info')}<span>Kolom <b>${missing.join(', ')}</b> belum terisi pada data periode ini. Lengkapi melalui template upload agar seluruh indikator workforce tampil.</span></div>` : '';
      let body;
      if (tab.cur === 'wf') {
        body = PH().kpiCards(['seat', 'sdm', 'prod', 'att', 'login'].filter(k => k !== 'seat' && k !== 'sdm'), rows, a, { tav: true });
        body = `<div class="kpis">${U.kpi({ label: 'Jumlah Seat', value: C.fmtInt(a.seat), icon: 'project', info: true, sub: C.isNum(a.seat) ? 'Nilai terakhir per project' : 'Belum ada data' })}${U.kpi({ label: 'Jumlah SDM', value: C.fmtInt(a.sdm), icon: 'workforce', info: true, sub: 'Nilai terakhir per project' })}${U.kpi({ label: 'Utilisasi Staffing', value: C.isNum(a.seat) && a.seat ? C.fmtPct(a.sdm / a.seat * 100) : '–', icon: 'workforce', info: true, sub: 'SDM / Seat' })}</div>` + body +
          `<div class="grid">${U.card('Seat vs SDM', U.chartBox('wf-seat'), { span: 's6' })}${U.card('Staffing Utilization', U.chartBox('wf-util'), { span: 's6', hint: 'SDM ÷ Seat per project' })}
          ${U.card('Attendance Trend', U.chartBox('wf-att', 'short'), { span: 's4' })}${U.card('Login Accuracy Trend', U.chartBox('wf-login', 'short'), { span: 's4' })}${U.card('Productivity Trend', U.chartBox('wf-prod', 'short'), { span: 's4' })}
          ${U.card('Workforce Alert', alerts.length ? alerts.map(([s, t]) => `<div class="alert-row ${s}"><span class="ic">${U.icon('alert')}</span><div>${esc(t)}</div></div>`).join('') : U.empty('Tidak ada alert workforce', 'Staffing, kehadiran, dan login sesuai target (untuk data yang tersedia).'))}</div>`;
      } else {
        const sched = a.sdm || 0; const present = C.isNum(a.att) ? Math.round(sched * a.att / 100) : null; const ontime = C.isNum(a.login) && present !== null ? Math.round(present * a.login / 100) : null;
        body = `<div class="kpis">${[['Total Agent', a.sdm], ['Scheduled', sched || null], ['Present', present], ['Absent', present !== null ? sched - present : null], ['Late', ontime !== null ? present - ontime : null], ['On Time', ontime]].map(([l, v]) => U.kpi({ label: l, value: C.fmtInt(v), info: true, sub: l === 'Total Agent' ? 'Jumlah SDM' : 'Estimasi harian rata-rata' })).join('')}</div>` +
          PH().kpiCards(['att', 'login'], rows, a, { tav: true }) +
          `<p class="muted small" style="margin:0">Present/Absent/Late/On Time diestimasi dari Jumlah SDM × % Kehadiran × % Ketepatan Login. Untuk angka absolut, tambahkan data absensi per agent.</p>
          <div class="grid">${U.card('Attendance Trend', U.chartBox('at-att'), { span: 's6' })}${U.card('Login Accuracy Trend', U.chartBox('at-login'), { span: 's6' })}${U.card('Project Comparison', U.chartBox('at-proj'), { span: 's12' })}${U.card('Ringkasan per project', '<div id="at-table"></div>')}</div>`;
      }
      return U.pageHead('Workforce Monitoring', 'Workforce Performance', App.periodLabel()) + tab.html + note + body;
    },
    mount() {
      const App = A(); const rows = App.rows(); if (!rows.length) return; const pal = U.palette(); const pp = App.perProject(rows); const s = App.series(rows); const L = PH().ymLabels(s);
      const line = (id, k, color, tKey) => U.chart(id, 'line', { labels: L, datasets: [{ label: PH().KPI_DEF[k].label, data: s.map(x => x[k]), borderColor: color, backgroundColor: U.alpha(color, .1), fill: true, tension: .3, spanGaps: true }].concat(tKey ? [{ label: 'Target', data: s.map(() => App.targetFor(rows, tKey)), borderColor: U.css('--bad'), borderDash: [6, 4], pointRadius: 0 }] : []) }, { scales: { y: { beginAtZero: false, suggestedMin: 80, max: 100 } } });
      if ((App.subTab.wf || 'wf') === 'wf') {
        const w = pp.filter(x => C.isNum(x.agg.sdm) || C.isNum(x.agg.seat));
        U.chart('wf-seat', 'bar', { labels: w.map(x => x.project.code), datasets: [{ label: 'Seat', data: w.map(x => x.agg.seat), backgroundColor: pal[4], borderRadius: 4 }, { label: 'SDM', data: w.map(x => x.agg.sdm), backgroundColor: pal[0], borderRadius: 4 }] });
        const u = w.filter(x => x.agg.seat > 0);
        if (u.length) U.chart('wf-util', 'bar', { labels: u.map(x => x.project.code), datasets: [{ label: 'Utilisasi %', data: u.map(x => x.agg.sdm / x.agg.seat * 100), backgroundColor: pal[2], borderRadius: 4 }] });
        else document.getElementById('wf-util').parentElement.innerHTML = U.empty('Data Jumlah Seat belum tersedia', 'Isi kolom Jumlah Seat pada template.');
        line('wf-att', 'att', pal[0], 'attendance'); line('wf-login', 'login', pal[3], 'login'); line('wf-prod', 'prod', pal[2], 'productivity');
      } else {
        line('at-att', 'att', pal[0], 'attendance'); line('at-login', 'login', pal[3], 'login');
        const q = pp.filter(x => C.isNum(x.agg.att) || C.isNum(x.agg.login));
        U.chart('at-proj', 'bar', { labels: q.map(x => x.project.code), datasets: [{ label: 'Attendance %', data: q.map(x => x.agg.att), backgroundColor: pal[0], borderRadius: 4 }, { label: 'Login Accuracy %', data: q.map(x => x.agg.login), backgroundColor: pal[3], borderRadius: 4 }, { label: 'Productivity %', data: q.map(x => x.agg.prod), backgroundColor: pal[2], borderRadius: 4 }] }, { scales: { y: { beginAtZero: false, suggestedMin: 80, max: 100 } } });
        U.dataTable('at-table', [{ k: 'code', label: 'Project' }, { k: 'sdm', label: 'Agent', r: 1, fmt: C.fmtInt }, { k: 'att', label: 'Attendance', r: 1, fmt: v => C.fmtPct(v) }, { k: 'login', label: 'Login Accuracy', r: 1, fmt: v => C.fmtPct(v) }, { k: 'prod', label: 'Productivity', r: 1, fmt: v => C.fmtPct(v) }], pp.map(x => Object.assign({ code: x.project.code }, x.agg)), { noPaging: true });
      }
    }
  };

  /* =================== 9. DIGITAL CHANNEL =================== */
  function channelStats(rows) {
    const tot = rows.reduce((s, r) => s + (r.totdigUsed || 0), 0);
    return C.CHANNELS.map(c => {
      let v = 0, rtw = 0, rtv = 0, htw = 0, htv = 0, rrw = 0, rrv = 0;
      rows.forEach(r => { const n = r[c.k] || 0; if (!n) return; v += n; if (C.isNum(r.rt)) { rtw += n; rtv += r.rt * n; } if (C.isNum(r.ht)) { htw += n; htv += r.ht * n; } if (C.isNum(r.rr)) { rrw += n; rrv += r.rr * n; } });
      return { k: c.k, label: c.label, volume: v, share: tot ? v / tot * 100 : null, rt: rtw ? rtv / rtw : null, ht: htw ? htv / htw : null, rr: rrw ? rrv / rrw : null };
    });
  }
  function heat(rowsLabel, colsLabel, getVal, fmt) {
    let max = 0; rowsLabel.forEach(r => colsLabel.forEach(c => { const v = getVal(r, c); if (C.isNum(v) && v > max) max = v; }));
    const c1 = U.css('--c1');
    return `<div class="tbl-wrap"><table class="tbl heat"><thead><tr><th></th>${colsLabel.map(c => `<th class="r">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rowsLabel.map(r => `<tr><td><b>${esc(r.label)}</b></td>${colsLabel.map(c => { const v = getVal(r, c); const a = C.isNum(v) && max ? .08 + .72 * (v / max) : 0; return `<td class="h" style="background:${a ? U.alpha(c1, a.toFixed(2)) : 'transparent'};color:${a > .5 ? '#fff' : 'inherit'}">${C.isNum(v) && v ? fmt(v) : '·'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  Pages.digital = {
    title: 'Digital Channel', icon: 'digital', perm: 'dashboard.view', filters: true,
    render() {
      const App = A(); const rows = App.rows(); const st = channelStats(rows); const act = st.filter(x => x.volume > 0).sort((a, b) => b.volume - a.volume);
      const head = U.pageHead('Digital Service', 'Digital Channel', App.periodLabel());
      const tab = App.tabs('dig', [['ov', 'Channel Overview'], ['rh', 'Response & Handling Time']]);
      if (!rows.length || !act.length) return head + tab.html + PH().noData('Tidak ada interaksi digital pada filter ini.');
      const a = App.agg(rows); const months = App.months().filter(m => rows.some(r => r.ym === m));
      if (tab.cur === 'ov') {
        const cards = st.slice().sort((x, y) => y.volume - x.volume).map(x => `<div class="kpi ${x.volume ? 'st-info' : ''}"><div class="lbl">${esc(x.label)}</div><div class="val">${C.fmtCompact(x.volume)}</div><div class="meta"><span>${x.volume ? C.fmtPct(x.share) + ' kontribusi' : 'Tidak ada volume'}</span></div>${x.volume ? `<div class="small muted">RT ${C.fmtSec(x.rt)} · HT ${C.fmtSec(x.ht)} · RR ${C.fmtPct(x.rr)}</div><div class="spark"><canvas id="dg-sp-${x.k}"></canvas></div>` : ''}</div>`).join('');
        const pp = App.perProject(rows).filter(x => x.agg.totdig > 0);
        return head + tab.html + PH().kpiCards(['totdig', 'rt', 'ht', 'rr'], rows, a) + `<div class="section-title"><h2>15 channel digital</h2><span>Volume, kontribusi & tren</span></div><div class="kpis">${cards}</div>
          <div class="grid">${U.card('Heatmap volume: channel × bulan', heat(act, months.map(m => ({ k: m, label: C.ymShort(m) })), (r, c) => rows.filter(x => x.ym === c.k).reduce((s, x) => s + (x[r.k] || 0), 0), C.fmtCompact), { hint: 'Warna makin pekat = trafik makin tinggi' })}
          ${U.card('Heatmap volume: channel × project', heat(act, pp.map(x => ({ k: x.project.id, label: x.project.code })), (r, c) => rows.filter(x => x.projectId === c.k).reduce((s, x) => s + (x[r.k] || 0), 0), C.fmtCompact))}</div>`;
      }
      return head + tab.html + `<div class="grid">${U.card('Response & Handling per channel', '<div id="rh-table"></div>', { hint: 'RT/HT/RR per channel = rata-rata tertimbang volume dari nilai harian project' })}
        ${U.card('Response vs Handling Time', U.chartBox('rh-bar', 'tall'), { span: 's6' })}${U.card('Tren bulanan', U.chartBox('rh-line', 'tall'), { span: 's6' })}
        ${U.card('Heatmap response time: project × bulan', heat(App.perProject(rows).filter(x => C.isNum(x.agg.rt)).map(x => ({ k: x.project.id, label: x.project.code })), months.map(m => ({ k: m, label: C.ymShort(m) })), (r, c) => App.agg(rows.filter(x => x.projectId === r.k && x.ym === c.k)).rt, C.fmtSec), { hint: 'Makin pekat = response time makin lama' })}</div>`;
    },
    mount() {
      const App = A(); const rows = App.rows(); const st = channelStats(rows); if (!st.some(x => x.volume)) return; const pal = U.palette();
      const months = App.months().filter(m => rows.some(r => r.ym === m));
      if ((App.subTab.dig || 'ov') === 'ov') { st.filter(x => x.volume).forEach(x => U.spark('dg-sp-' + x.k, months.map(m => rows.filter(r => r.ym === m).reduce((s, r) => s + (r[x.k] || 0), 0)), pal[1])); return; }
      const act = st.filter(x => x.volume).sort((a, b) => b.volume - a.volume); const tg = { rt: App.targetFor(rows, 'rt'), ht: App.targetFor(rows, 'ht'), rr: App.targetFor(rows, 'rr') }; const F = App.F();
      U.dataTable('rh-table', [{ k: 'label', label: 'Channel' }, { k: 'volume', label: 'Volume', r: 1, fmt: C.fmtInt }, { k: 'share', label: 'Kontribusi', r: 1, fmt: v => C.fmtPct(v) },
        { k: 'rt', label: 'Response Time', r: 1, fmt: v => C.isNum(v) ? `${C.fmtSec(v)} ${U.pill(C.status(v, tg.rt, false, F))}` : '–' },
        { k: 'ht', label: 'Handling Time', r: 1, fmt: v => C.isNum(v) ? `${C.fmtSec(v)} ${U.pill(C.status(v, tg.ht, false, F))}` : '–' },
        { k: 'rr', label: 'Response Rate', r: 1, fmt: v => C.isNum(v) ? `${C.fmtPct(v)} ${U.pill(C.status(v, tg.rr, true, F))}` : '–' }], act, { noPaging: true, search: false, sortK: 'volume' });
      U.chart('rh-bar', 'bar', { labels: act.map(x => x.label), datasets: [{ label: 'Response Time (dtk)', data: act.map(x => x.rt), backgroundColor: pal[0], borderRadius: 4 }, { label: 'Handling Time (dtk)', data: act.map(x => x.ht), backgroundColor: pal[2], borderRadius: 4 }, { type: 'line', label: 'Target RT', data: act.map(() => tg.rt), borderColor: U.css('--bad'), borderDash: [6, 4], pointRadius: 0 }] }, { scales: { y: { ticks: { callback: v => C.fmtSec(v) } } } });
      const s = App.series(rows);
      U.chart('rh-line', 'line', { labels: PH().ymLabels(s), datasets: [{ label: 'Response Time', data: s.map(x => x.rt), borderColor: pal[0], tension: .3, spanGaps: true, yAxisID: 'y' }, { label: 'Handling Time', data: s.map(x => x.ht), borderColor: pal[2], tension: .3, spanGaps: true, yAxisID: 'y' }, { label: 'Response Rate %', data: s.map(x => x.rr), borderColor: pal[1], borderDash: [4, 3], tension: .3, spanGaps: true, yAxisID: 'y1' }] }, { scales: { y: { ticks: { callback: v => C.fmtSec(v) } }, y1: { position: 'right', min: 0, max: 100, grid: { display: false } } } });
    }
  };
})();

</script>
<script>/* js/pages-admin.js */
/* =========================================================================
 * HALAMAN DATA & ADMINISTRASI:
 * Customer/Project, Data Upload Center, Report Center, User Management,
 * Access Management, Audit Log, System Settings (KPI & formula)
 * ========================================================================= */
(function () {
  'use strict';
  const C = window.Core, U = window.UI, esc = C.esc;
  const Pages = window.Pages = window.Pages || {};
  const A = () => window.App; const PH = () => window.PH;
  const now = () => new Date().toISOString();
  const dt = s => (s || '').slice(0, 16).replace('T', ' ');
  const val = (root, id) => { const e = root.querySelector('#' + id); return e ? e.value.trim() : ''; };

  /* =================== 10. CUSTOMER / PROJECT =================== */
  const STATUSES = ['Active', 'Inactive', 'Onboarding', 'Closed'];
  const stPill = s => U.pill(s === 'Active' ? 'ok' : s === 'Onboarding' ? 'info' : s === 'Closed' ? 'bad' : 'na', s);
  Pages.master = {
    title: 'Customer / Project', icon: 'master', perm: ['dashboard.view', 'customer.manage', 'project.manage'], filters: false,
    render() {
      const App = A(); const tab = App.tabs('master', [['cust', 'Customer'], ['proj', 'Project']]);
      const add = tab.cur === 'cust' ? (App.can('customer.manage') ? `<button class="btn primary" id="m-add">${U.icon('plus')} Tambah Customer</button>` : '') : (App.can('project.manage') ? `<button class="btn primary" id="m-add">${U.icon('plus')} Tambah Project</button>` : '');
      return U.pageHead('Master Data', 'Customer / Project', 'Data customer, project, PIC, kontrak, dan target layanan.', add) + tab.html + U.card('', '<div id="m-table"></div>');
    },
    mount() {
      const App = A(); const cur = App.subTab.master || 'cust'; const addBtn = document.getElementById('m-add');
      if (cur === 'cust') {
        const rows = App.customersInScope().map(c => { const ps = App.data.projects.filter(p => p.customerId === c.id); const rr = App.data.allRows.filter(r => r.customerId === c.id); const a = App.agg(rr); return Object.assign({}, c, { nProj: ps.length, projects: ps, agents: a.sdm, channels: C.CHANNELS.filter(ch => a[ch.k] > 0).length + (a.off > 0 ? 1 : 0) + (a.ob > 0 ? 1 : 0) }); });
        U.dataTable('m-table', [{ k: 'id', label: 'Customer ID' }, { k: 'name', label: 'Customer Name', fmt: (v, r) => `<b>${esc(v)}</b><div class="muted small">${esc(r.contactCenter || '')}</div>` }, { k: 'industry', label: 'Industry' }, { k: 'nProj', label: 'Project', fmt: (v, r) => r.projects.map(p => `<span class="tag">${esc(p.code)}</span>`).join('') || '–' }, { k: 'pic', label: 'PIC', fmt: v => esc(v || '–') }, { k: 'startDate', label: 'Start' }, { k: 'endDate', label: 'Contract End' }, { k: 'status', label: 'Status', fmt: stPill }, { k: 'agents', label: 'Total Agent', r: 1, fmt: C.fmtInt }, { k: 'channels', label: 'Total Channel', r: 1 },
          { k: 'act', label: '', noSort: 1, fmt: (v, r) => `<span class="row" style="flex-wrap:nowrap"><button class="btn sm" data-cdash="${esc(r.id)}">${U.icon('exec')} Dashboard</button>${App.can('customer.manage') ? `<button class="btn sm ghost" data-cedit="${esc(r.id)}" aria-label="Edit">${U.icon('edit')}</button>` : ''}${App.isSuper() ? `<button class="btn sm ghost" data-cdel="${esc(r.id)}" aria-label="Hapus">${U.icon('trash')}</button>` : ''}</span>` }],
          rows, { sortK: 'name', dir: 1, onRender: el => {
            el.querySelectorAll('[data-cdash]').forEach(b => b.addEventListener('click', () => customerDash(b.dataset.cdash)));
            el.querySelectorAll('[data-cedit]').forEach(b => b.addEventListener('click', () => customerForm(App.cust(b.dataset.cedit))));
            el.querySelectorAll('[data-cdel]').forEach(b => b.addEventListener('click', () => delCustomer(b.dataset.cdel)));
          } });
        if (addBtn) addBtn.addEventListener('click', () => customerForm(null));

    const name = prefill ? `Template_Daily_Performance_${p.code}_${UP.period}.xlsx` : 'Template_Daily_Performance.xlsx';

  async function handleFile(file) {
    const App = A(); reset(); UP.file = file;
    if (!/\.(xlsx|xls|csv)$/i.test(file.name)) { UP.result = { structureOk: false, structureErrors: [{ row: '-', col: '-', error: 'Format file tidak didukung', rec: 'Gunakan file .xlsx dari template standar.' }], errors: [], warnings: [], rows: [] }; return App.render(); }
    if (file.size > 10 * 1024 * 1024) { UP.result = { structureOk: false, structureErrors: [{ row: '-', col: '-', error: 'Ukuran file melebihi 10 MB', rec: 'Pisahkan data per bulan / per project.' }], errors: [], warnings: [], rows: [] }; return App.render(); }
    if (!UP.project || !UP.period) { U.toast('Pilih project dan periode terlebih dahulu.', 'bad'); UP.file = null; return App.render(); }
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: false });
      const sheetName = wb.SheetNames.includes('DATA') ? 'DATA' : wb.SheetNames[0];
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: null, blankrows: false });
      const key = UP.project + '_' + UP.period; const ex = App.data.perf[key];
      const res = C.validateSheet(aoa, { project: App.proj(UP.project), period: UP.period, existingDates: new Set(ex ? ex.rows.map(r => r.date) : []), formulas: App.F() });
      res.sheetName = sheetName; res.validatedAt = now(); UP.result = res;
    } catch (e) { UP.result = { structureOk: false, structureErrors: [{ row: '-', col: '-', error: 'File tidak dapat dibaca: ' + e.message, rec: 'Pastikan file tidak terkunci password atau rusak.' }], errors: [], warnings: [], rows: [] }; }
    App.render();
  }

    const App = A(); const [audit, logins] = await Promise.all([App.can('audit.view') ? App.ds.listAudit(1000).catch(() => []) : [], App.ds.listLoginHistory(500).catch(() => [])]);
