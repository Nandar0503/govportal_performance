<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CC Performance Management</title>
<meta name="description" content="Corporate Contact Center Performance Management">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sidebar navy tetap + kanvas putih; header ringkas, filter global, grid kartu 12 kolom */
:root{
  --navy-950:#071226; --navy-900:#0A1A33; --navy-800:#12284B; --navy-700:#1B3561;
  --accent:#1F5BD8; --accent-ink:#ffffff; --accent-soft:#E7EEFC; --accent-line:#C9D8F7;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#E2E7EF; --line-2:#EEF1F6;
  --text:#0E1A2C; --muted:#5A6A80; --faint:#8695AA;
  --ok:#14864F; --ok-soft:#E3F4EA; --risk:#B97800; --risk-soft:#FCF1DA; --bad:#C8323F; --bad-soft:#FBE6E8; --info:#1F5BD8; --info-soft:#E7EEFC;
  --c1:#1F5BD8; --c2:#12A19B; --c3:#7B5CE8; --c4:#E2782F; --c5:#5D7189; --c6:#D9488F; --c7:#3BA9E6; --c8:#A2B23A;
  --shadow:0 1px 2px rgba(14,26,44,.05),0 4px 14px rgba(14,26,44,.05);
  --shadow-lg:0 12px 40px rgba(7,18,38,.18);
  --r:12px; --r-sm:8px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --side-w:252px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#5B8DEF; --accent-ink:#06101F; --accent-soft:#16284A; --accent-line:#28406B;
  --bg:#0A1220; --surface:#101B2D; --surface-2:#0D1727; --line:#21304A; --line-2:#192740;
  --text:#E5ECF6; --muted:#9AAAC0; --faint:#6F819A;
  --ok:#3DC489; --ok-soft:#10301F; --risk:#E9B347; --risk-soft:#33270E; --bad:#F06A75; --bad-soft:#3A1519; --info:#5B8DEF; --info-soft:#16284A;
  --c1:#5B8DEF; --c2:#2CC2BB; --c3:#9D85F2; --c4:#F0965A; --c5:#8EA0B8; --c6:#EC74AE; --c7:#62C0F0; --c8:#C2D15A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#5B8DEF; --accent-ink:#06101F; --accent-soft:#16284A; --accent-line:#28406B;
  --bg:#0A1220; --surface:#101B2D; --surface-2:#0D1727; --line:#21304A; --line-2:#192740;
  --text:#E5ECF6; --muted:#9AAAC0; --faint:#6F819A;
  --ok:#3DC489; --ok-soft:#10301F; --risk:#E9B347; --risk-soft:#33270E; --bad:#F06A75; --bad-soft:#3A1519; --info:#5B8DEF; --info-soft:#16284A;
  --c1:#5B8DEF; --c2:#2CC2BB; --c3:#9D85F2; --c4:#F0965A; --c5:#8EA0B8; --c6:#EC74AE; --c7:#62C0F0; --c8:#C2D15A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
a.btn{text-decoration:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- LOGIN ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface)}
.login-brand{background:var(--navy-900);color:#E6EDF8;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.025),0 0 0 120px rgba(255,255,255,.02)}
.brand-mark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}
.brand-mark .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#2F6BEA,#1748B0);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.login-brand h1{font-size:clamp(26px,3vw,38px);line-height:1.15;font-weight:800;max-width:16ch;color:#fff}
.login-brand p{color:#A9B8D0;max-width:46ch;margin:14px 0 0}
.login-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:520px;position:relative;z-index:1}
.login-stats div{border-top:1px solid rgba(255,255,255,.14);padding-top:10px}
.login-stats b{display:block;font-family:var(--mono);font-size:20px;color:#fff}
.login-stats span{font-size:12px;color:#93A5C2}
.login-form-wrap{display:grid;place-items:center;padding:40px 20px}
.login-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.login-form h2{font-size:24px;font-weight:700}
.login-form .sub{color:var(--muted);margin-top:-8px}
.demo-box{border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--text)}
.demo-box .accts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.demo-box button{border:1px solid var(--accent-line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.demo-box button:hover{border-color:var(--accent)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-brand{padding:28px 20px}.login-stats{display:none}}

/* ---------- FORM CONTROLS ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.input,select.input,textarea.input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 11px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:80px;padding:9px 11px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.link-btn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:13px}
.err-msg{color:var(--bad);font-size:13px;min-height:1em}

/* ---------- SHELL ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{background:var(--navy-900);color:#C5D2E6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:13px;line-height:1.25}
.side-head .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#2F6BEA,#1748B0);display:grid;place-items:center;flex:none}
.side nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6F84A6;padding:14px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:#C5D2E6;text-decoration:none;font-size:13.2px;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav-item svg{width:17px;height:17px;opacity:.8;flex:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:#1B3561;color:#fff;box-shadow:inset 0 0 0 1px rgba(120,160,240,.25)}
.nav-item.active svg{opacity:1;color:#8FB2FF}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#7C90B0}
.mode-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:#C5D2E6;font-weight:600}
.mode-pill i{width:7px;height:7px;border-radius:50%;background:#3DC489;display:inline-block}
.mode-pill.demo i{background:#E9B347}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:60px}
.topbar .menu-btn{display:none}
.crumb{min-width:0;flex:1}
.crumb .corp{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .active-proj{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.badge-dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.user-chip .who{display:flex;flex-direction:column;line-height:1.15}
.user-chip .who b{font-size:12.5px}
.user-chip .who span{font-size:11px;color:var(--muted)}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(380px,calc(100vw - 32px));z-index:60;overflow:hidden}
.dropdown header{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dropdown .list{max-height:420px;overflow-y:auto}
.notif{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:12.8px}
.notif .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.demo-banner svg,.empty svg{width:16px;height:16px;flex:none}
.demo-banner{background:var(--risk-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--risk) 30%,transparent);border-radius:var(--r-sm);padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- FILTER BAR ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.filters .field{flex:1 1 150px;max-width:230px}
.filters .field.wide{max-width:300px;flex-basis:260px}
.filters .range{display:flex;gap:6px}
.filters .btns{display:flex;gap:8px;margin-left:auto}
.filter-summary{font-size:12px;color:var(--muted)}

/* ---------- PAGE ---------- */
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s9{grid-column:span 9}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1200px){.s3{grid-column:span 6}.s4{grid-column:span 6}.s5,.s7{grid-column:span 12}.s8,.s9{grid-column:span 12}}
@media (max-width:760px){.s3,.s4,.s6{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px 0}
.card-h h3{font-size:13.5px;font-weight:700}
.card-h .hint{font-size:11.5px;color:var(--muted)}
.card-b{padding:12px 16px 16px;min-width:0;flex:1}
.chart-box{position:relative;height:250px}
.chart-box.tall{height:320px}.chart-box.short{height:190px}
.section-title{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.section-title h2{font-size:15px;font-weight:800}
.section-title span{color:var(--muted);font-size:12.5px}

/* KPI tiles */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;box-shadow:var(--shadow);position:relative}
.kpi .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lbl svg{width:14px;height:14px;color:var(--faint)}
.kpi .val{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);min-height:20px}
.kpi .spark{height:28px;margin-top:2px}
.kpi.st-ok{border-top:3px solid var(--ok)}.kpi.st-risk{border-top:3px solid var(--risk)}.kpi.st-bad{border-top:3px solid var(--bad)}.kpi.st-info{border-top:3px solid var(--info)}
.kpi .tav{display:grid;grid-template-columns:repeat(3,auto);gap:2px 10px;font-size:11px;color:var(--muted)}
.kpi .tav b{color:var(--text);font-family:var(--mono);font-weight:600}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.risk{background:var(--risk-soft);color:var(--risk)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.na{background:var(--line-2);color:var(--faint)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.plain::before{display:none}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--line-2);color:var(--muted);font-size:11px;font-weight:600;margin:1px 2px 1px 0}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.card .tbl-wrap{border:0;border-radius:0;margin:0 -16px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.wrap{min-width:280px;max-width:460px;white-space:normal}
.tbl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbl-tools .input{max-width:260px;height:34px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:60px;flex:1}
.bar-cell .track{flex:1;height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;position:relative}
.bar-cell .fill{height:100%;border-radius:99px;background:var(--accent)}
.bar-cell .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55}
.heat td.h{text-align:right;font-family:var(--mono);font-size:12px;min-width:64px}

/* misc */
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.alert-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:12.8px}
.alert-row:last-child{border-bottom:0}
.alert-row>div{min-width:0;overflow-wrap:anywhere}
.alert-row .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.alert-row .ic svg{width:14px;height:14px}
.alert-row.bad .ic{background:var(--bad-soft);color:var(--bad)}.alert-row.risk .ic{background:var(--risk-soft);color:var(--risk)}.alert-row.info .ic{background:var(--info-soft);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.multi{border:1px solid var(--line);border-radius:var(--r-sm);max-height:160px;overflow-y:auto;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px}
.gauge{position:relative;height:150px}
.gauge .g-val{position:absolute;left:0;right:0;bottom:12px;text-align:center}
.gauge .g-val b{font-family:var(--mono);font-size:26px;display:block}
.gauge .g-val span{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:0;flex-wrap:wrap;counter-reset:s}
.step{flex:1 1 100px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--faint);font-weight:600;min-width:90px}
.step .bar{height:4px;border-radius:99px;background:var(--line);margin-right:4px}
.step.done{color:var(--ok)}.step.done .bar{background:var(--ok)}
.step.cur{color:var(--accent)}.step.cur .bar{background:var(--accent)}
.step.fail{color:var(--bad)}.step.fail .bar{background:var(--bad)}
.drop{display:block;border:1.5px dashed var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;transition:border-color .15s}
.drop.over{border-color:var(--accent)}
.drop svg{width:30px;height:30px;color:var(--accent)}
.progress{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat-strip div{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface-2)}
.stat-strip span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat-strip b{font-family:var(--mono);font-size:16px;word-break:break-word}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(7,18,38,.5);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(1040px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h h3{font-size:16px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast svg{width:18px;height:18px;flex:none}
.toast{background:var(--navy-900);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.toast.bad{background:#8E1F2A}.toast.ok{background:#0F5E39}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:10px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* responsive shell */
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);transform:translateX(-100%);transition:transform .2s;height:100%}
  .shell.nav-open .side{transform:none;box-shadow:var(--shadow-lg)}
  .shell.nav-open::after{content:"";position:fixed;inset:0;background:rgba(7,18,38,.4);z-index:35}
  .topbar .menu-btn{display:grid}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .user-chip .who{display:none}
  .filters .field{max-width:none}
}

<script>/* js/core.js */
/* =========================================================================
 * CORE: konstanta, template Excel, RBAC, mesin kalkulasi & validasi.
 * Semua dashboard, report, dan alert memakai fungsi di file ini sehingga
 * angka di Executive / Project / Report selalu sama.
 * ========================================================================= */
(function () {
  'use strict';

  /* ---------- STANDARD EXCEL TEMPLATE (urutan & nama kolom WAJIB persis) ---------- */
  // key: nama field internal; t: tipe (text|month|date|day|int|num|pct|sec)
  const TEMPLATE_COLUMNS = [
    { h: 'PROJECT', k: 'project', t: 'text', req: true, d: 'Kode project (lihat sheet MASTER)' },
    { h: 'MONTH', k: 'month', t: 'month', req: true, d: 'JAN, FEB, ... DEC' },
    { h: 'DATE', k: 'date', t: 'date', req: true, d: 'Tanggal (format tanggal Excel / YYYY-MM-DD)' },
    { h: 'DAY', k: 'day', t: 'day', d: 'Nama hari (Senin/Monday)' },
    { h: 'Call Offered (Inbound)', k: 'off', t: 'int', d: 'Jumlah panggilan masuk' },
    { h: 'ACD Call (Inbound)', k: 'acd', t: 'int', d: 'Panggilan terjawab agent' },
    { h: 'Accepted Call (Inbound)', k: 'acc', t: 'int', d: 'Otomatis = ACD Call bila kosong' },
    { h: 'Abandon Call (Inbound)', k: 'abd', t: 'int', d: 'Panggilan abandon' },
    { h: 'AHT (Inbound)', k: 'aht', t: 'sec', d: 'Detik (atau hh:mm:ss)' },
    { h: 'Call Minute', k: 'cmin', t: 'num', d: 'Total menit panggilan' },
    { h: 'SCR', k: 'scr', t: 'pct', d: '0-100% (0.95 atau 95)' },
    { h: 'SL', k: 'sl', t: 'pct', d: 'Service Level 0-100%' },
    { h: 'Target SCR', k: 'tscr', t: 'pct', d: 'Target SCR harian' },
    { h: 'Realisasi SCR', k: 'rscr', t: 'pct', d: 'Realisasi SCR harian' },
    { h: 'Call Outbond (Jumlah)', k: 'ob', t: 'int', d: 'Jumlah call outbound' },
    { h: 'Walkin', k: 'walkin', t: 'int', ch: true },
    { h: 'SMS', k: 'sms', t: 'int', ch: true },
    { h: 'Email', k: 'email', t: 'int', ch: true },
    { h: 'Aplikasi', k: 'aplikasi', t: 'int', ch: true },
    { h: 'Chatbot', k: 'chatbot', t: 'int', ch: true },
    { h: 'Facebook', k: 'facebook', t: 'int', ch: true },
    { h: 'Threads', k: 'threads', t: 'int', ch: true },
    { h: 'Instagram', k: 'instagram', t: 'int', ch: true },
    { h: 'Live Chat', k: 'livechat', t: 'int', ch: true },
    { h: 'Video Call', k: 'videocall', t: 'int', ch: true },
    { h: 'Apps', k: 'apps', t: 'int', ch: true },
    { h: 'Twiter (X)', k: 'twitter', t: 'int', ch: true },
    { h: 'WhatsApp interaction', k: 'wa', t: 'int', ch: true },
    { h: 'Whatsapp blasting', k: 'wablast', t: 'int', ch: true },
    { h: 'OTP', k: 'otp', t: 'int', ch: true },
    { h: 'Respon Time masing masing chanel', k: 'rt', t: 'sec', d: 'Rata-rata response time digital (detik)' },
    { h: 'Handling Time masing masing channel Digital', k: 'ht', t: 'sec', d: 'Rata-rata handling time digital (detik)' },
    { h: 'Respon Rate', k: 'rr', t: 'pct', d: '0-100%' },
    { h: 'Informasi', k: 'info', t: 'int' },
    { h: 'Permintaan', k: 'perm', t: 'int' },
    { h: 'Komplain', k: 'komp', t: 'int' },
    { h: 'Non Pengaduan', k: 'nonp', t: 'int' },
    { h: 'Top Kategori 1', k: 'top1', t: 'text' },
    { h: 'Top Kategori 2', k: 'top2', t: 'text' },
    { h: 'Top Kategori 3', k: 'top3', t: 'text' },
    { h: 'Issue Ketidak tercapaian SCR', k: 'issue', t: 'text', d: 'Wajib diisi bila SCR < Target' },
    { h: 'Total Digital', k: 'totdig', t: 'int', d: 'Otomatis dihitung dari 15 channel digital' },
    { h: 'Jumlah Seat', k: 'seat', t: 'int' },
    { h: 'Jumlah SDM', k: 'sdm', t: 'int' },
    { h: 'Total Trafik All', k: 'tottraffic', t: 'int', d: 'Otomatis = Accepted + Outbound + Total Digital' },
    { h: 'Quality Score', k: 'qs', t: 'pct', d: 'Skor 0-100' },
    { h: 'Product Knowledge Score', k: 'pk', t: 'pct', d: 'Skor 0-100' },
    { h: 'Productifity Agent', k: 'prod', t: 'pct', d: '0-100%' },
    { h: 'Kehadiran', k: 'att', t: 'pct', d: 'Agent hadir / terjadwal x 100%' },
    { h: 'Ketepatan Login', k: 'login', t: 'pct', d: 'Login tepat waktu / total schedule x 100%' }
  ];

  const CHANNELS = TEMPLATE_COLUMNS.filter(c => c.ch).map(c => ({ k: c.k, label: c.h === 'Twiter (X)' ? 'Twitter/X' : c.h === 'WhatsApp interaction' ? 'WhatsApp' : c.h === 'Whatsapp blasting' ? 'WA Blasting' : c.h }));
  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const MONTHS_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const MONTH_ALIASES = { JAN: 1, JANUARI: 1, JANUARY: 1, FEB: 2, FEBRUARI: 2, FEBUARI: 2, FEBRUARY: 2, MAR: 3, MARET: 3, MARCH: 3, APR: 4, APRIL: 4, MAY: 5, MEI: 5, JUN: 6, JUNI: 6, JUNE: 6, JUL: 7, JULI: 7, JULY: 7, AUG: 8, AGU: 8, AGT: 8, AGUSTUS: 8, AUGUST: 8, SEP: 9, SEPT: 9, SEPTEMBER: 9, OCT: 10, OKT: 10, OKTOBER: 10, OCTOBER: 10, NOV: 11, NOVEMBER: 11, DEC: 12, DES: 12, DESEMBER: 12, DECEMBER: 12 };
  const DAYS_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const DAYS_EN = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

  /* ---------- ROLES & PERMISSIONS ---------- */
  const ROLES = {
    super_admin: { label: 'Super Admin', all: true },
    corporate_admin: { label: 'Corporate Admin', all: true },
    project_manager: { label: 'Project Manager' },
    project_admin: { label: 'Project Admin' },
    data_entry: { label: 'Data Entry / Performance Admin' },
    viewer: { label: 'Viewer / Customer' }
  };
  const PERMISSIONS = [
    ['dashboard.view', 'Lihat dashboard'],
    ['template.download', 'Download template'],
    ['upload.data', 'Upload & submit data'],
    ['upload.approve', 'Approve / reject / reprocess upload'],
    ['data.delete', 'Hapus data & riwayat upload'],
    ['report.export', 'Generate & export report'],
    ['report.schedule', 'Jadwalkan report'],
    ['issue.edit', 'Kelola issue SCR'],
    ['customer.manage', 'Kelola customer'],
    ['project.manage', 'Kelola project'],
    ['kpi.configure', 'Konfigurasi KPI & target'],
    ['user.view', 'Monitoring user'],
    ['user.manage', 'Kelola user'],
    ['audit.view', 'Lihat audit log'],
    ['permission.manage', 'Kelola permission'],
    ['settings.manage', 'Pengaturan sistem & formula']
  ];
  const ALL = PERMISSIONS.map(p => p[0]);
  const DEFAULT_ROLE_PERMS = {
    super_admin: ALL.slice(),
    corporate_admin: ['dashboard.view', 'template.download', 'upload.data', 'upload.approve', 'report.export', 'report.schedule', 'issue.edit', 'customer.manage', 'project.manage', 'kpi.configure', 'user.view', 'user.manage', 'audit.view'],
    project_manager: ['dashboard.view', 'template.download', 'upload.data', 'report.export', 'issue.edit'],
    project_admin: ['dashboard.view', 'template.download', 'upload.data', 'report.export', 'issue.edit'],
    data_entry: ['template.download', 'upload.data'],
    viewer: ['dashboard.view', 'report.export']
  };

  /* ---------- FORMULA & ALERT DEFAULTS (dapat diubah Super Admin) ---------- */
  const DEFAULT_FORMULAS = {
    acceptedFromAcd: true,          // Accepted Call = ACD Call
    scrSource: 'uploaded',          // 'uploaded' | 'computed' (ACD/Offered)
    scrAggregate: 'weighted',       // 'weighted' (ΣACD/ΣOffered) | 'average'
    totalDigital: 'computed',       // 'computed' (Σ15 channel) | 'uploaded'
    totalTraffic: 'computed',       // 'computed' | 'uploaded'
    atRiskBand: 2,                  // poin % di bawah target masih 'At Risk'
    ahtRiskPct: 10,                 // % di atas target AHT masih 'At Risk'
    qualityExcellent: 95, qualityGood: 85
  };
  const DEFAULT_KPI = { scr: 90, sl: 90, aht: 300, quality: 90, pk: 80, productivity: 90, attendance: 98, login: 95, rt: 900, ht: 600, rr: 95 };

  /* ---------- UTIL ---------- */
  const isNum = v => typeof v === 'number' && isFinite(v);
  const sum = (arr, f) => arr.reduce((a, r) => { const v = f ? f(r) : r; return isNum(v) ? a + v : a; }, 0);
  const avg = arr => { const v = arr.filter(isNum); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const pad = n => String(n).padStart(2, '0');
  const ymOf = d => d.slice(0, 7);
  const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const ymLabel = ym => { if (!ym) return ''; const [y, m] = ym.split('-'); return MONTHS_ID[+m - 1] + ' ' + y; };
  const ymShort = ym => { const [y, m] = ym.split('-'); return MONTHS_ID[+m - 1].slice(0, 3) + ' ' + y.slice(2); };
  const fmtInt = v => isNum(v) ? Math.round(v).toLocaleString('id-ID') : '–';
  const fmtNum = (v, d = 1) => isNum(v) ? v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–';
  const fmtPct = (v, d = 1) => isNum(v) ? fmtNum(v, d) + '%' : '–';
  const fmtCompact = v => { if (!isNum(v)) return '–'; const a = Math.abs(v); if (a >= 1e6) return fmtNum(v / 1e6, 2) + ' jt'; if (a >= 1e4) return fmtNum(v / 1e3, 1) + ' rb'; return fmtInt(v); };
  const fmtSec = v => { if (!isNum(v)) return '–'; v = Math.round(v); if (v < 60) return v + ' dtk'; const h = Math.floor(v / 3600), m = Math.floor((v % 3600) / 60), s = v % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const isoWeek = dateStr => { const d = new Date(dateStr + 'T00:00:00'); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return t.getUTCFullYear() + '-W' + pad(Math.ceil(((t - y0) / 86400000 + 1) / 7)); };
  async function sha256(text) {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0; return 'fallback-' + h; }
  }

  /* ---------- STATUS ---------- */
  // higher=true: makin tinggi makin baik. Return 'ok' | 'risk' | 'bad' | 'na'
  function status(value, target, higher = true, F = DEFAULT_FORMULAS) {
    if (!isNum(value) || !isNum(target)) return 'na';
    if (higher) { if (value >= target) return 'ok'; if (value >= target - (F.atRiskBand ?? 2)) return 'risk'; return 'bad'; }
    if (value <= target) return 'ok'; if (value <= target * (1 + (F.ahtRiskPct ?? 10) / 100)) return 'risk'; return 'bad';
  }
  const STATUS_LABEL = { ok: 'Achieved', risk: 'At Risk', bad: 'Below Target', na: 'No Data' };

  /* ---------- KALKULASI ---------- */
  // Menerapkan auto-calculation pada satu baris (dipakai saat upload & saat membaca).
  function computeRow(r, F = DEFAULT_FORMULAS) {
    const o = Object.assign({}, r);
    if (F.acceptedFromAcd && isNum(o.acd)) o.acc = o.acd;
    else if (!isNum(o.acc) && isNum(o.acd)) o.acc = o.acd;
    const chSum = CHANNELS.reduce((a, c) => a + (isNum(o[c.k]) ? o[c.k] : 0), 0);
    const hasCh = CHANNELS.some(c => isNum(o[c.k]));
    o.totdigCalc = hasCh ? chSum : (isNum(o.totdig) ? o.totdig : 0);
    o.totdigUsed = F.totalDigital === 'uploaded' && isNum(o.totdig) ? o.totdig : o.totdigCalc;
    o.trafficCalc = (isNum(o.acc) ? o.acc : 0) + (isNum(o.ob) ? o.ob : 0) + o.totdigUsed;
    o.trafficUsed = F.totalTraffic === 'uploaded' && isNum(o.tottraffic) ? o.tottraffic : o.trafficCalc;
    o.abdRate = isNum(o.abd) && isNum(o.off) && o.off > 0 ? o.abd / o.off * 100 : null;
    o.scrCalc = isNum(o.acd) && isNum(o.off) && o.off > 0 ? o.acd / o.off * 100 : null;
    o.scrUsed = F.scrSource === 'computed' ? (o.scrCalc ?? o.scr ?? null) : (isNum(o.scr) ? o.scr : o.scrCalc);
    return o;
  }

  // Agregasi satu kumpulan baris (multi project / multi hari)
  function aggregate(rows, F = DEFAULT_FORMULAS) {
    const a = { days: rows.length };
    ['off', 'acd', 'acc', 'abd', 'ob', 'cmin', 'info', 'perm', 'komp', 'nonp'].forEach(k => a[k] = sum(rows, r => r[k]));
    CHANNELS.forEach(c => a[c.k] = sum(rows, r => r[c.k]));
    a.totdig = sum(rows, r => r.totdigUsed);
    a.traffic = sum(rows, r => r.trafficUsed);
    a.abdRate = a.off > 0 ? a.abd / a.off * 100 : null;
    const scrRows = rows.filter(r => isNum(r.scrUsed));
    if (F.scrAggregate === 'weighted') {
      const w = scrRows.filter(r => isNum(r.off) && r.off > 0);
      const wo = sum(w, r => r.off);
      a.scr = wo > 0 ? sum(w, r => r.scrUsed * r.off) / wo : avg(scrRows.map(r => r.scrUsed));
    } else a.scr = avg(scrRows.map(r => r.scrUsed));
    const slRows = rows.filter(r => isNum(r.sl));
    const slw = slRows.filter(r => isNum(r.off) && r.off > 0); const so = sum(slw, r => r.off);
    a.sl = so > 0 ? sum(slw, r => r.sl * r.off) / so : avg(slRows.map(r => r.sl));
    a.tscr = avg(rows.map(r => r.tscr));
    a.rscr = avg(rows.map(r => r.rscr));
    const ahtR = rows.filter(r => isNum(r.aht) && isNum(r.acd) && r.acd > 0); const aw = sum(ahtR, r => r.acd);
    a.aht = aw > 0 ? sum(ahtR, r => r.aht * r.acd) / aw : avg(rows.map(r => r.aht));
    const dw = k => { const rr = rows.filter(r => isNum(r[k]) && r.totdigUsed > 0); const w = sum(rr, r => r.totdigUsed); return w > 0 ? sum(rr, r => r[k] * r.totdigUsed) / w : avg(rows.map(r => r[k])); };
    a.rt = dw('rt'); a.ht = dw('ht'); a.rr = avg(rows.map(r => r.rr));
    ['qs', 'pk', 'prod', 'att', 'login'].forEach(k => a[k] = avg(rows.map(r => r[k])));
    // headcount: nilai terakhir per project, lalu dijumlahkan
    const last = {};
    rows.forEach(r => { ['seat', 'sdm'].forEach(k => { if (isNum(r[k])) { const key = r.projectId + k; if (!last[key] || last[key].d <= r.date) last[key] = { d: r.date, v: r[k], k }; } }); });
    a.seat = null; a.sdm = null;
    Object.values(last).forEach(x => { a[x.k] = (a[x.k] || 0) + x.v; });
    a.projects = new Set(rows.map(r => r.projectId)).size;
    return a;
  }

  function groupBy(rows, keyFn) { const m = new Map(); rows.forEach(r => { const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; }
  function series(rows, keyFn, F) { const g = groupBy(rows, keyFn); return [...g.keys()].sort().map(k => ({ key: k, ...aggregate(g.get(k), F) })); }

  function qualityBand(v, F = DEFAULT_FORMULAS) { if (!isNum(v)) return null; return v >= F.qualityExcellent ? 'Excellent' : v >= F.qualityGood ? 'Good' : 'Need Improvement'; }

  // Alert otomatis per project
  function buildAlerts(perProject, targets, F) {
    const out = [];
    const chk = (p, label, val, tgt, higher, unit) => {
      const st = status(val, tgt, higher, F); if (st === 'ok' || st === 'na') return;
      const gap = Math.abs(val - tgt);
      const txt = higher ? `${label} ${p.name} berada di bawah target sebesar ${unit === 's' ? fmtSec(gap) : fmtNum(gap, 1) + '%'} (${unit === 's' ? fmtSec(val) : fmtPct(val)} vs target ${unit === 's' ? fmtSec(tgt) : fmtPct(tgt)}).`
        : `${label} ${p.name} melebihi target sebesar ${fmtSec(gap)} (${fmtSec(val)} vs ${fmtSec(tgt)}).`;
      out.push({ projectId: p.id, project: p.name, kpi: label, severity: st, text: txt });
    };
    perProject.forEach(({ project: p, agg: a }) => {

<script>/* js/data-demo.js */
/* =========================================================================
 * DATA SERVICE - MODE DEMO
 * Implementasi in-memory dengan antarmuka yang sama persis dengan
 * data-firebase.js. Dipakai untuk pratinjau / demonstrasi tanpa backend.
 * Data disimpan di browser (localStorage) bila tersedia.
 * ========================================================================= */
(function () {
  'use strict';
  const C = window.Core;
  const KEY = 'ccpm-demo-v2';
  const DEMO_PASSWORD = 'Demo#2026';
  let S = null; let session = null; const listeners = [];

  const store = {
    get(k, sess) { try { return (sess ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
    set(k, v, sess) { try { (sess ? sessionStorage : localStorage).setItem(k, v); } catch (e) { } },
    del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { } }
  };
  let saveTimer = null;
  function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set(KEY, JSON.stringify(S)), 300); }
  const clone = o => JSON.parse(JSON.stringify(o));
  const now = () => new Date().toISOString();

  async function freshState() {
    const seed = window.SEED;
    const hash = await C.sha256('ccpm:' + DEMO_PASSWORD);
    const u = (id, name, email, role, projects = [], customers = []) => ({ id, name, username: email.split('@')[0], email, phone: '', role, projects, customers, status: 'active', createdAt: now(), lastLogin: null, pwHash: hash });
    const st = {
      users: [
        u('u-super', 'Super Admin', 'superadmin@demo.id', 'super_admin'),
        u('u-corp', 'Corporate Admin', 'corporate@demo.id', 'corporate_admin'),
        u('u-pm', 'PM Kebencanaan & Cuaca', 'pm.bmkg@demo.id', 'project_manager', ['PRJ-BMKG', 'PRJ-BNPB', 'PRJ-BASARNAS']),
        u('u-padm', 'Admin Project Dikti', 'admin.dikti@demo.id', 'project_admin', ['PRJ-DIKTI']),
        u('u-entry', 'Performance Admin', 'dataentry@demo.id', 'data_entry', ['PRJ-KEJAGUNG', 'PRJ-KEMENKOP', 'PRJ-KEMENHUB']),
        u('u-view', 'Viewer Kejaksaan', 'viewer.kejagung@demo.id', 'viewer', ['PRJ-KEJAGUNG'], ['CUS-KEJAGUNG'])
      ],
      customers: clone(seed.customers), projects: clone(seed.projects), kpi: clone(seed.kpi),
      settings: { formulas: clone(C.DEFAULT_FORMULAS), permissions: clone(C.DEFAULT_ROLE_PERMS) },
      months: {}, agents: clone(seed.agents), uploads: [], uploadErrors: {}, issues: {}, reports: [], audit: [], loginHistory: [], loginAttempts: []
    };
    Object.entries(seed.months).forEach(([key, rows]) => {
      const [pid, period] = key.split('_'); const p = seed.projects.find(x => x.id === pid);
      st.months[key] = { id: key, projectId: pid, customerId: p ? p.customerId : '', period, rows, source: 'seed', uploadId: null, updatedAt: seed.generatedAt, updatedBy: 'Import data awal' };
    });
    st.uploads.push({ id: 'up-seed', fileName: 'dashboard_performance_govseg3_ytd_2026_fixed.xlsx', projectId: '*', projectName: 'Semua project (data awal)', period: '2026-01 s/d 2026-09', totalRows: Object.values(seed.months).reduce((a, r) => a + r.length, 0), validRows: Object.values(seed.months).reduce((a, r) => a + r.length, 0), errorRows: 0, duplicateRows: 0, missingData: 0, uploadedAt: seed.generatedAt, uploadedBy: 'Sistem', status: 'Approved', note: 'Import data awal dari file Excel yang diberikan' });
    return st;
  }

  function profileOf(u) { if (!u) return null; const p = clone(u); delete p.pwHash; return p; }
  function emit() { const p = session ? profileOf(S.users.find(u => u.id === session.uid)) : null; listeners.forEach(f => f(p)); }
  function inScope(pid, ids) { return !ids || ids.includes(pid); }

  const DS = {
    mode: 'demo',
    demoPassword: DEMO_PASSWORD,
    async init() {
      const raw = store.get(KEY);
      if (raw) { try { S = JSON.parse(raw); } catch (e) { S = null; } }
      if (!S || !S.users) { S = await freshState(); persist(); }
      const sraw = store.get('ccpm-demo-session', true) || store.get('ccpm-demo-session');
      if (sraw) { try { session = JSON.parse(sraw); } catch (e) { session = null; } }
      if (session) { const u = S.users.find(x => x.id === session.uid); if (!u || u.status !== 'active') session = null; }
      setTimeout(emit, 0);
      return 'demo';
    },
    async resetDemo() { store.del(KEY); store.del('ccpm-demo-session'); S = await freshState(); persist(); session = null; emit(); },
    onAuthChange(cb) { listeners.push(cb); },
    sessionId() { return session ? session.sid : '-'; },
    async bootstrapStatus() { return { needsSetup: false }; },
    async login(email, password, remember) {
      email = String(email || '').trim().toLowerCase();
      const u = S.users.find(x => x.email.toLowerCase() === email || x.username.toLowerCase() === email);
      const recent = S.loginAttempts.filter(a => a.email === email && Date.now() - new Date(a.at).getTime() < 5 * 60000);
      if (recent.length >= 5) throw new Error('Terlalu banyak percobaan gagal. Coba lagi dalam 5 menit.');
      const fail = async reason => { S.loginAttempts.unshift({ id: C.uid('la'), email, at: now(), reason }); persist(); throw new Error(reason); };
      if (!u) return fail('Email/username atau password salah.');
      if (u.pwHash !== await C.sha256('ccpm:' + password)) return fail('Email/username atau password salah.');
      if (u.status !== 'active') return fail('Akun dinonaktifkan. Hubungi administrator.');
      session = { uid: u.id, sid: C.uid('sess'), at: now() };
      store.del('ccpm-demo-session'); store.set('ccpm-demo-session', JSON.stringify(session), !remember);
      u.lastLogin = now();
      S.loginHistory.unshift({ id: C.uid('lh'), userId: u.id, userName: u.name, email: u.email, at: now(), sessionId: session.sid, agent: navigator.userAgent.slice(0, 80) });
      persist(); emit();
      return profileOf(u);
    },
    async logout() { session = null; store.del('ccpm-demo-session'); emit(); },
    async forgotPassword(email) { const u = S.users.find(x => x.email.toLowerCase() === String(email).trim().toLowerCase()); return { sent: true, demo: true, exists: !!u }; },
    async changePassword(userId, pw) { const u = S.users.find(x => x.id === userId); if (u) { u.pwHash = await C.sha256('ccpm:' + pw); persist(); } },
    // USERS
    async listUsers() { return S.users.map(profileOf); },
    async createUser(data, password) {
      if (S.users.some(u => u.email.toLowerCase() === data.email.toLowerCase())) throw new Error('Email sudah terdaftar.');
      const u = Object.assign({ id: C.uid('u'), createdAt: now(), lastLogin: null, status: 'active' }, clone(data), { pwHash: await C.sha256('ccpm:' + password) });
      S.users.push(u); persist(); return profileOf(u);
    },
    async updateUser(id, patch) { const u = S.users.find(x => x.id === id); if (!u) throw new Error('User tidak ditemukan'); Object.assign(u, clone(patch)); persist(); if (session && id === session.uid) emit(); return profileOf(u); },
    async deleteUser(id) { S.users = S.users.filter(x => x.id !== id); persist(); },
    async adminResetPassword(user) { await this.changePassword(user.id, DEMO_PASSWORD); return { demo: true, password: DEMO_PASSWORD }; },
    // MASTER
    async listCustomers() { return clone(S.customers); },
    async saveCustomer(c) { const i = S.customers.findIndex(x => x.id === c.id); if (i >= 0) S.customers[i] = clone(c); else S.customers.push(clone(c)); persist(); },
    async deleteCustomer(id) { S.customers = S.customers.filter(x => x.id !== id); persist(); },
    async listProjects() { return clone(S.projects); },
    async saveProject(p) { const i = S.projects.findIndex(x => x.id === p.id); if (i >= 0) S.projects[i] = clone(p); else S.projects.push(clone(p)); persist(); },
    async deleteProject(id) { S.projects = S.projects.filter(x => x.id !== id); Object.keys(S.months).forEach(k => { if (S.months[k].projectId === id) delete S.months[k]; }); persist(); },
    async getKpiTargets() { return clone(S.kpi); },
    async saveKpiTarget(pid, obj) { S.kpi[pid] = clone(obj); persist(); },
    async getSettings() { return clone(S.settings); },
    async saveSetting(key, val) { S.settings[key] = clone(val); persist(); },
    // PERFORMANCE
    async loadPerformance(ids) { const o = {}; Object.entries(S.months).forEach(([k, v]) => { if (inScope(v.projectId, ids)) o[k] = v; }); return clone(o); },
    async getPerformanceMonth(key) { return S.months[key] ? clone(S.months[key]) : null; },
    async savePerformanceMonth(doc) { S.months[doc.id] = clone(doc); persist(); },
    async deletePerformanceMonth(key) { delete S.months[key]; persist(); },
    async loadAgents(ids) { return clone(S.agents.filter(a => inScope(a.projectId, ids))); },
    // UPLOADS
    async listUploads(ids) { return clone(S.uploads.filter(u => u.projectId === '*' ? !ids : inScope(u.projectId, ids))); },
    async saveUpload(rec) { const i = S.uploads.findIndex(x => x.id === rec.id); if (i >= 0) S.uploads[i] = clone(rec); else S.uploads.unshift(clone(rec)); persist(); },
    async deleteUpload(id) { S.uploads = S.uploads.filter(x => x.id !== id); delete S.uploadErrors[id]; persist(); },
    async saveUploadErrors(id, errors) { S.uploadErrors[id] = clone(errors.list || errors); persist(); },
    async getUploadErrors(id) { return clone(S.uploadErrors[id] || []); },
    async uploadFile(file, path) { return { path, url: null, stored: false, note: 'Mode demo: file tidak disimpan ke storage.' }; },
    // ISSUES & REPORTS
    async listIssues(ids) { return clone(Object.values(S.issues).filter(i => inScope(i.projectId, ids))); },
    async saveIssue(issue) { S.issues[issue.id] = clone(issue); persist(); },
    async listReports() { return clone(S.reports); },
    async saveReport(r) { const i = S.reports.findIndex(x => x.id === r.id); if (i >= 0) S.reports[i] = clone(r); else S.reports.unshift(clone(r)); persist(); },
    async deleteReport(id) { S.reports = S.reports.filter(x => x.id !== id); persist(); },
    // AUDIT
    async audit(e) { S.audit.unshift(Object.assign({ id: C.uid('al'), at: now(), sessionId: session ? session.sid : '-' }, e)); if (S.audit.length > 2000) S.audit.length = 2000; persist(); },
    async listAudit(limit = 500) { return clone(S.audit.slice(0, limit)); },
    async listLoginHistory(limit = 300) { return clone(S.loginHistory.slice(0, limit)); },
    async listFailedLogins(limit = 300) { return clone(S.loginAttempts.slice(0, limit)); },
    async importSeed() { const fresh = await freshState(); S.months = fresh.months; S.agents = fresh.agents; persist(); return { months: Object.keys(S.months).length }; },
    async countRecords() { return Object.values(S.months).reduce((a, m) => a + m.rows.length, 0); }
  };
  window.DemoDataService = DS;
})();

</script>
<script>/* js/data-firebase.js */
/* =========================================================================
 * DATA SERVICE - FIREBASE (Auth + Firestore + Storage)
 * Antarmuka identik dengan data-demo.js.
 *
 * Koleksi Firestore:
 *   users, usernames, customers, projects, kpi_targets, daily_performance,
 *   quality_performance, upload_history, upload_errors, issue_tracking,
 *   reports, audit_logs, login_history, login_attempts, system_settings
 * (roles & permissions disimpan di system_settings/permissions)
 * ========================================================================= */
(function () {
  'use strict';
  const C = window.Core;
  let F = {}; let app, auth, db, storage; let profile = null; let sid = C.uid('sess');
  const listeners = [];
  const now = () => new Date().toISOString();
  const strip = o => JSON.parse(JSON.stringify(o)); // buang undefined

  const MSG = {
    'auth/invalid-credential': 'Email/username atau password salah.',
    'auth/wrong-password': 'Email/username atau password salah.',
    'auth/user-not-found': 'Email/username atau password salah.',
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/too-many-requests': 'Terlalu banyak percobaan gagal. Akun dikunci sementara, coba lagi nanti atau reset password.',
    'auth/user-disabled': 'Akun dinonaktifkan. Hubungi administrator.',
    'auth/email-already-in-use': 'Email sudah terdaftar.',
    'auth/weak-password': 'Password minimal 8 karakter.',
    'auth/network-request-failed': 'Koneksi ke server gagal. Periksa jaringan Anda.',
    'permission-denied': 'Anda tidak memiliki akses untuk aksi ini.'
  };
  const friendly = e => new Error(MSG[e && e.code] || (e && e.message) || 'Terjadi kesalahan.');

  async function loadProfile(user) {
    if (!user) return null;
    const snap = await F.getDoc(F.doc(db, 'users', user.uid));
    if (!snap.exists()) return null;
    return Object.assign({ id: user.uid }, snap.data());
  }
  function emit(p, err) { profile = p; listeners.forEach(f => f(p, err)); }

  async function queryScoped(colName, ids) {
    const col = F.collection(db, colName);
    if (!ids) { const s = await F.getDocs(col); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); }
    const out = [];
    for (const pid of ids) { const s = await F.getDocs(F.query(col, F.where('projectId', '==', pid))); s.docs.forEach(d => out.push(Object.assign({ id: d.id }, d.data()))); }
    return out;
  }

  const DS = {
    mode: 'firebase',
    async init() {
      const v = window.APP_CONFIG.firebaseSdkVersion; const base = `https://www.gstatic.com/firebasejs/${v}/`;
      const [A, AU, FS] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      let ST = null; try { ST = await import(base + 'firebase-storage.js'); } catch (e) { ST = null; }
      F = Object.assign({}, A, AU, FS, ST ? { ref: ST.ref, uploadBytes: ST.uploadBytes, getDownloadURL: ST.getDownloadURL, getStorage: ST.getStorage } : {});
      app = F.initializeApp(window.APP_CONFIG.firebase);
      auth = F.getAuth(app); db = F.getFirestore(app);
      try { storage = F.getStorage ? F.getStorage(app) : null; } catch (e) { storage = null; }
      // uji koneksi ringan: baca dokumen bootstrap (publik)
      await Promise.race([F.getDoc(F.doc(db, 'system_settings', 'bootstrap')), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 12000))]);
      F.onAuthStateChanged(auth, async user => {
        if (!user) return emit(null);
        try {
          const p = await loadProfile(user);
          if (!p) { await F.signOut(auth); return emit(null, 'Profil user belum terdaftar. Hubungi Super Admin.'); }
          if (p.status !== 'active') { await F.signOut(auth); return emit(null, 'Akun dinonaktifkan. Hubungi administrator.'); }
          emit(p);
        } catch (e) { emit(null, friendly(e).message); }
      });
      return 'firebase';
    },
    onAuthChange(cb) { listeners.push(cb); },
    sessionId() { return sid; },
    async bootstrapStatus() { const s = await F.getDoc(F.doc(db, 'system_settings', 'bootstrap')); return { needsSetup: !s.exists() }; },
    async createFirstAdmin({ name, email, password, username }) {
      try {
        const cred = await F.createUserWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid; const b = F.writeBatch(db);
        username = (username || email.split('@')[0]).toLowerCase();
        b.set(F.doc(db, 'users', uid), { name, username, email, phone: '', role: 'super_admin', projects: [], customers: [], status: 'active', createdAt: now(), lastLogin: now() });
        b.set(F.doc(db, 'usernames', username), { email, uid });
        b.set(F.doc(db, 'system_settings', 'bootstrap'), { uid, at: now() });
        await b.commit();
        const p = await loadProfile(cred.user); emit(p); return p;
      } catch (e) { throw friendly(e); }
    },
    async login(id, password, remember) {
      id = String(id || '').trim().toLowerCase(); let email = id;
      try {
        if (!id.includes('@')) { const s = await F.getDoc(F.doc(db, 'usernames', id)); if (!s.exists()) throw { code: 'auth/invalid-credential' }; email = s.data().email; }
        await F.setPersistence(auth, remember ? F.browserLocalPersistence : F.browserSessionPersistence);
        const cred = await F.signInWithEmailAndPassword(auth, email, password);
        const p = await loadProfile(cred.user);
        if (!p) { await F.signOut(auth); throw new Error('Profil user belum terdaftar. Hubungi Super Admin.'); }
        if (p.status !== 'active') { await F.signOut(auth); throw new Error('Akun dinonaktifkan. Hubungi administrator.'); }
        sid = C.uid('sess');
        await F.updateDoc(F.doc(db, 'users', p.id), { lastLogin: now() });
        await F.addDoc(F.collection(db, 'login_history'), { userId: p.id, userName: p.name, email: p.email, at: now(), sessionId: sid, agent: navigator.userAgent.slice(0, 80) });
        return p;
      } catch (e) {
        try { await F.addDoc(F.collection(db, 'login_attempts'), { email, at: now(), reason: (e && e.code) || 'error' }); } catch (x) { }
        throw e instanceof Error && !e.code ? e : friendly(e);
      }
    },
    async logout() { await F.signOut(auth); },
    async forgotPassword(email) { try { await F.sendPasswordResetEmail(auth, String(email).trim()); return { sent: true }; } catch (e) { throw friendly(e); } },
    // USERS
    async listUsers() { const s = await F.getDocs(F.collection(db, 'users')); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async createUser(data, password) {
      const sec = F.initializeApp(window.APP_CONFIG.firebase, 'sec-' + Date.now());
      try {
        const sAuth = F.getAuth(sec);
        const cred = await F.createUserWithEmailAndPassword(sAuth, data.email, password);
        const uid = cred.user.uid; await F.signOut(sAuth);
        const doc = strip(Object.assign({ createdAt: now(), lastLogin: null }, data));
        const b = F.writeBatch(db);
        b.set(F.doc(db, 'users', uid), doc);
        if (data.username) b.set(F.doc(db, 'usernames', data.username.toLowerCase()), { email: data.email, uid });
        await b.commit();
        return Object.assign({ id: uid }, doc);
      } catch (e) { throw friendly(e); } finally { try { await F.deleteApp(sec); } catch (e) { } }
    },
    async updateUser(id, patch) {
      try {
        const b = F.writeBatch(db); b.update(F.doc(db, 'users', id), strip(patch));
        if (patch.username && patch.email) b.set(F.doc(db, 'usernames', patch.username.toLowerCase()), { email: patch.email, uid: id });
        await b.commit();
        if (profile && profile.id === id) emit(Object.assign({}, profile, patch));
      } catch (e) { throw friendly(e); }
    },
    async deleteUser(id) {
      const s = await F.getDoc(F.doc(db, 'users', id)); const b = F.writeBatch(db);
      if (s.exists() && s.data().username) b.delete(F.doc(db, 'usernames', s.data().username.toLowerCase()));
      b.delete(F.doc(db, 'users', id)); await b.commit();
    },
    async adminResetPassword(user) { await F.sendPasswordResetEmail(auth, user.email); return { sent: true }; },
    // MASTER DATA
    async listCustomers() { const s = await F.getDocs(F.collection(db, 'customers')); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async saveCustomer(c) { await F.setDoc(F.doc(db, 'customers', c.id), strip(c)); },
    async deleteCustomer(id) { await F.deleteDoc(F.doc(db, 'customers', id)); },
    async listProjects() { const s = await F.getDocs(F.collection(db, 'projects')); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async saveProject(p) { await F.setDoc(F.doc(db, 'projects', p.id), strip(p)); },
    async deleteProject(id) { await F.deleteDoc(F.doc(db, 'projects', id)); },
    async getKpiTargets() { const s = await F.getDocs(F.collection(db, 'kpi_targets')); const o = {}; s.docs.forEach(d => { const x = d.data(); delete x.projectId; o[d.id] = x; }); return o; },
    async saveKpiTarget(pid, obj) { await F.setDoc(F.doc(db, 'kpi_targets', pid), strip(Object.assign({ projectId: pid }, obj))); },
    async getSettings() {
      const out = { formulas: Object.assign({}, C.DEFAULT_FORMULAS), permissions: JSON.parse(JSON.stringify(C.DEFAULT_ROLE_PERMS)) };
      for (const k of ['formulas', 'permissions']) { try { const s = await F.getDoc(F.doc(db, 'system_settings', k)); if (s.exists()) out[k] = Object.assign(out[k], s.data().value || {}); } catch (e) { } }
      return out;
    },
    async saveSetting(key, val) { await F.setDoc(F.doc(db, 'system_settings', key), { value: strip(val), updatedAt: now() }); },
    // PERFORMANCE
    async loadPerformance(ids) { const list = await queryScoped('daily_performance', ids); const o = {}; list.forEach(d => o[d.id] = d); return o; },
    async getPerformanceMonth(key) { try { const s = await F.getDoc(F.doc(db, 'daily_performance', key)); return s.exists() ? Object.assign({ id: s.id }, s.data()) : null; } catch (e) { if (e && e.code === 'permission-denied') return null; throw e; } },
    async savePerformanceMonth(doc) { const d = strip(doc); delete d.id; await F.setDoc(F.doc(db, 'daily_performance', doc.id), d); },
    async deletePerformanceMonth(key) { await F.deleteDoc(F.doc(db, 'daily_performance', key)); },
    async loadAgents(ids) { const list = await queryScoped('quality_performance', ids); return list.flatMap(d => (d.agents || []).map(a => Object.assign({ projectId: d.projectId }, a))); },
    // UPLOADS
    async listUploads(ids) { const l = await queryScoped('upload_history', ids); return l.sort((a, b) => (b.uploadedAt || '').localeCompare(a.uploadedAt || '')); },
    async saveUpload(rec) { const d = strip(rec); delete d.id; await F.setDoc(F.doc(db, 'upload_history', rec.id), d); },
    async deleteUpload(id) { await F.deleteDoc(F.doc(db, 'upload_history', id)); try { await F.deleteDoc(F.doc(db, 'upload_errors', id)); } catch (e) { } },
    async saveUploadErrors(id, errors) { await F.setDoc(F.doc(db, 'upload_errors', id), { projectId: errors.projectId || null, errors: strip(errors.list || errors).slice(0, 3000) }); },
    async getUploadErrors(id) { const s = await F.getDoc(F.doc(db, 'upload_errors', id)); return s.exists() ? (s.data().errors || []) : []; },
    async uploadFile(file, path) {
      if (!storage || !F.ref) return { path, url: null, stored: false, note: 'Firebase Storage tidak aktif.' };
      try { const r = F.ref(storage, path); await F.uploadBytes(r, file); const url = await F.getDownloadURL(r); return { path, url, stored: true }; }
      catch (e) { return { path, url: null, stored: false, note: 'File tidak tersimpan ke Storage (' + (e.code || e.message) + ').' }; }
    },
    // ISSUES & REPORTS
    async listIssues(ids) { return queryScoped('issue_tracking', ids); },
    async saveIssue(issue) { const d = strip(issue); delete d.id; await F.setDoc(F.doc(db, 'issue_tracking', issue.id), d); },
    async listReports() { const s = await F.getDocs(F.query(F.collection(db, 'reports'), F.where('ownerId', '==', profile ? profile.id : '-'))); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async saveReport(r) { const d = strip(Object.assign({ ownerId: profile ? profile.id : null }, r)); delete d.id; await F.setDoc(F.doc(db, 'reports', r.id), d); },
    async deleteReport(id) { await F.deleteDoc(F.doc(db, 'reports', id)); },
    // AUDIT
    async audit(e) { try { await F.addDoc(F.collection(db, 'audit_logs'), strip(Object.assign({ at: now(), serverAt: F.serverTimestamp(), sessionId: sid, userId: profile ? profile.id : null }, e))); } catch (x) { console.warn('audit gagal', x); } },
    async listAudit(limit = 500) { const s = await F.getDocs(F.query(F.collection(db, 'audit_logs'), F.orderBy('at', 'desc'), F.limit(limit))); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async listLoginHistory(limit = 300) { const s = await F.getDocs(F.query(F.collection(db, 'login_history'), F.orderBy('at', 'desc'), F.limit(limit))); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    async listFailedLogins(limit = 300) { const s = await F.getDocs(F.query(F.collection(db, 'login_attempts'), F.orderBy('at', 'desc'), F.limit(limit))); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); },
    // IMPORT DATA AWAL (dari file Excel yang diberikan)
    async importSeed(seed, progress) {
      const ops = [];
      seed.customers.forEach(c => ops.push(['customers', c.id, c]));
      seed.projects.forEach(p => ops.push(['projects', p.id, p]));
      Object.entries(seed.kpi).forEach(([pid, k]) => ops.push(['kpi_targets', pid, Object.assign({ projectId: pid }, k)]));
      Object.entries(seed.months).forEach(([key, rows]) => { const [pid, period] = key.split('_'); const p = seed.projects.find(x => x.id === pid); ops.push(['daily_performance', key, { projectId: pid, customerId: p ? p.customerId : '', period, rows, source: 'seed', uploadId: 'up-seed', updatedAt: now(), updatedBy: 'Import data awal' }]); });
      const byP = {}; seed.agents.forEach(a => { (byP[a.projectId] = byP[a.projectId] || []).push(a); });
      Object.entries(byP).forEach(([pid, agents]) => ops.push(['quality_performance', pid, { projectId: pid, agents }]));
      const total = Object.values(seed.months).reduce((a, r) => a + r.length, 0);
      ops.push(['upload_history', 'up-seed', { fileName: 'dashboard_performance_govseg3_ytd_2026_fixed.xlsx', projectId: '*', projectName: 'Semua project (data awal)', period: '2026-01 s/d 2026-09', totalRows: total, validRows: total, errorRows: 0, duplicateRows: 0, missingData: 0, uploadedAt: now(), uploadedBy: profile ? profile.name : 'Sistem', status: 'Approved', note: 'Import data awal' }]);
      for (let i = 0; i < ops.length; i += 10) {
        const b = F.writeBatch(db);
        ops.slice(i, i + 10).forEach(([c, id, data]) => b.set(F.doc(db, c, id), strip(data)));
        await b.commit(); progress && progress(Math.min(1, (i + 10) / ops.length));
      }
      return { docs: ops.length };
    }
  };
  window.FirebaseDataService = DS;
})();

</script>

  function card(title, body, opts = {}) {
    return `<section class="card ${opts.span || 's12'} ${opts.cls || ''}" ${opts.id ? `id="${opts.id}"` : ''}>
      ${title ? `<div class="card-h"><h3>${esc(title)}</h3>${opts.hint ? `<span class="hint">${esc(opts.hint)}</span>` : ''}${opts.tools || ''}</div>` : ''}
      <div class="card-b">${body}</div></section>`;
  }
  const chartBox = (id, cls = '') => `<div class="chart-box ${cls}"><canvas id="${id}" role="img" aria-label="grafik"></canvas></div>`;
  // KPI card: {label, value, icon, status, target, actual, ach, sub, spark:id}
  function kpi(o) {
    const st = o.status && o.status !== 'na' ? 'st-' + o.status : (o.info ? 'st-info' : '');
    return `<div class="kpi ${st}">
      <div class="lbl">${o.icon ? icon(o.icon) : ''}${esc(o.label)}</div>
      <div class="val" title="${esc(o.value)}">${esc(o.value)}</div>
      ${o.target !== undefined ? `<div class="tav"><span>Target</span><span>Aktual</span><span>Ach.</span><b>${esc(o.target)}</b><b>${esc(o.actual ?? o.value)}</b><b>${esc(o.ach ?? '–')}</b></div>` : ''}
      <div class="meta"><span>${o.sub ? esc(o.sub) : ''}</span>${o.status ? pill(o.status) : ''}</div>
      ${o.spark ? `<div class="spark"><canvas id="${o.spark}"></canvas></div>` : ''}
    </div>`;
  }
  function pageHead(eyebrow, title, desc, actions = '') {
    return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${desc ? `<p>${esc(desc)}</p>` : ''}</div><div class="page-actions">${actions}</div></div>`;
  }
  function barCell(v, max, target, color) {
    const w = C.isNum(v) && max > 0 ? Math.max(0, Math.min(100, v / max * 100)) : 0;
    const t = C.isNum(target) && max > 0 ? Math.min(100, target / max * 100) : null;
    return `<div class="bar-cell"><div class="track"><div class="fill" style="width:${w}%;background:${color || 'var(--accent)'}"></div>${t !== null ? `<div class="tick" style="left:${t}%"></div>` : ''}</div></div>`;
  }

  /* ---------- DATA TABLE ---------- */
  // columns: [{k, label, r(right), fmt(v,row) -> html, sort(row) -> value, wrap}]
  function dataTable(container, columns, rows, opts = {}) {
    const el = typeof container === 'string' ? document.getElementById(container) : container;
    if (!el) return;
    const st = { q: '', sortK: opts.sortK || null, dir: opts.dir || -1, page: 0, size: opts.pageSize || 15 };
    function render() {
      let data = rows;
      if (st.q) { const q = st.q.toLowerCase(); data = data.filter(r => columns.some(c => String(c.sort ? c.sort(r) : r[c.k] ?? '').toLowerCase().includes(q))); }
      if (st.sortK) { const col = columns.find(c => c.k === st.sortK); const get = col && col.sort ? col.sort : r => r[st.sortK]; data = data.slice().sort((a, b) => { const x = get(a), y = get(b); if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }
      const pages = Math.max(1, Math.ceil(data.length / st.size)); st.page = Math.min(st.page, pages - 1);
      const view = opts.noPaging ? data : data.slice(st.page * st.size, st.page * st.size + st.size);
      el.innerHTML = `${opts.search !== false ? `<div class="tbl-tools"><input class="input" type="search" placeholder="Cari…" value="${esc(st.q)}" aria-label="Cari di tabel">${opts.tools || ''}</div>` : ''}
        <div class="tbl-wrap"><table class="tbl ${opts.cls || ''}"><thead><tr>${columns.map(c => `<th class="${c.noSort ? '' : 'sortable'} ${c.r ? 'r' : ''}" data-k="${c.k}">${esc(c.label)}${st.sortK === c.k ? (st.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead>
        <tbody>${view.length ? view.map((r, i) => `<tr>${columns.map(c => `<td class="${c.r ? 'r' : ''} ${c.wrap ? 'wrap' : ''}">${c.fmt ? c.fmt(r[c.k], r, i) : esc(r[c.k] ?? '–')}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${columns.length}">${empty('Tidak ada data', opts.emptyMsg || 'Ubah filter atau upload data baru.')}</td></tr>`}</tbody></table></div>
        ${opts.noPaging ? '' : `<div class="tbl-foot"><span>${data.length.toLocaleString('id-ID')} baris</span><span class="row"><button class="btn sm" data-p="-1" ${st.page === 0 ? 'disabled' : ''}>Sebelumnya</button><span>${st.page + 1} / ${pages}</span><button class="btn sm" data-p="1" ${st.page >= pages - 1 ? 'disabled' : ''}>Berikutnya</button></span></div>`}`;
      const inp = el.querySelector('input[type=search]');
      if (inp) inp.addEventListener('input', e => { st.q = e.target.value; st.page = 0; const pos = e.target.selectionStart; render(); const n = el.querySelector('input[type=search]'); n.focus(); n.setSelectionRange(pos, pos); });
      el.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; if (st.sortK === k) st.dir *= -1; else { st.sortK = k; st.dir = -1; } render(); }));
      el.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { st.page += +b.dataset.p; render(); }));
      opts.onRender && opts.onRender(el);
    }
    render();
    return { refresh(newRows) { if (newRows) rows = newRows; render(); } };
  }

  /* ---------- MODAL & TOAST ---------- */
  function modal({ title, body, foot, wide, onMount }) {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Tutup">${icon('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    const f = ov.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 30);
    onMount && onMount(ov, close);
    return { el: ov, close };
  }
  function confirmBox(title, msg, okLabel = 'Ya, lanjutkan', danger = true) {
    return new Promise(res => {
      const m = modal({ title, body: `<p style="margin:0">${msg}</p>`, foot: `<button class="btn" data-close>Batal</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button>` });
      m.el.querySelector('[data-ok]').addEventListener('click', () => { m.close(); res(true); });
      m.el.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => res(false)));
    });
  }
  function toast(msg, type = '') {
    const t = document.createElement('div'); t.className = 'toast ' + type; t.innerHTML = `${icon(type === 'bad' ? 'alert' : type === 'ok' ? 'check' : 'info')}<span>${esc(msg)}</span>`;
    document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 4800);
  }

  /* ---------- CHART ---------- */
  const charts = {};
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const palette = () => ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8'].map(css);
  const alpha = (hex, a) => { const h = hex.replace('#', ''); if (h.length !== 6) return hex; const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  function destroyCharts() { Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch (e) { } delete charts[k]; }); }
  function chart(id, type, data, options = {}) {
    const cv = document.getElementById(id); if (!cv || !window.Chart) return null;
    if (charts[id]) { charts[id].destroy(); }
    const text = css('--muted'), grid = css('--line-2');
    Chart.defaults.font.family = css('--font') || 'sans-serif'; Chart.defaults.font.size = 11; Chart.defaults.color = text;
    const isCart = !['doughnut', 'pie'].includes(type);
    const base = {
      responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
      interaction: { mode: isCart ? 'index' : 'nearest', intersect: false },
      plugins: { legend: { display: (data.datasets || []).length > 1 || !isCart, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded', padding: 12 } },
        tooltip: { backgroundColor: css('--navy-900'), titleColor: '#fff', bodyColor: '#DCE6F5', padding: 10, cornerRadius: 8, boxPadding: 4 } },
      scales: isCart ? { x: { grid: { display: false }, ticks: { color: text, maxRotation: 0, autoSkip: true, autoSkipPadding: 8 }, border: { color: grid } }, y: { grid: { color: grid }, ticks: { color: text }, border: { display: false }, beginAtZero: true } } : undefined
    };
    const merged = deepMerge(base, options);
    charts[id] = new Chart(cv, { type, data, options: merged });
    return charts[id];
  }
  function spark(id, values, color) {
    const c = color || css('--c1');
    return chart(id, 'line', { labels: values.map((_, i) => i), datasets: [{ data: values, borderColor: c, backgroundColor: alpha(c, .12), fill: true, borderWidth: 1.6, pointRadius: values.map((_, i) => i === values.length - 1 ? 2.5 : 0), pointBackgroundColor: c, tension: .35, spanGaps: true }] },
      { plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false, beginAtZero: false } }, animation: false });
  }
  function deepMerge(a, b) { const o = Array.isArray(a) ? a.slice() : Object.assign({}, a); Object.keys(b || {}).forEach(k => { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a && typeof a[k] === 'object' && a[k] !== null) o[k] = deepMerge(a[k], b[k]); else o[k] = b[k]; }); return o; }
  // gauge setengah lingkaran
  function gauge(id, value, target, st) {
    const v = C.isNum(value) ? Math.max(0, Math.min(100, value)) : 0;
    const col = st === 'ok' ? css('--ok') : st === 'risk' ? css('--risk') : st === 'bad' ? css('--bad') : css('--c5');
    return chart(id, 'doughnut', { labels: ['Aktual', 'Sisa'], datasets: [{ data: [v, 100 - v], backgroundColor: [col, css('--line-2')], borderWidth: 0, circumference: 180, rotation: 270, cutout: '74%' }] },
      { plugins: { legend: { display: false }, tooltip: { enabled: false } }, aspectRatio: 2 });
  }

  /* ---------- FILE / DOWNLOAD ---------- */
  let dlCap; // namespace capability downloads (hanya saat berjalan sebagai artifact)
  async function saveFile(filename, blob) {
    if (dlCap === undefined) { try { dlCap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dlCap = null; } }
    if (dlCap) { try { await dlCap.save({ filename, data: blob }); return true; } catch (e) { if (e && e.code === 'cancelled') return false; toast('File tidak dapat disimpan: ' + (e.message || e.code), 'bad'); return false; } }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  }
  function workbookBlob(wb) { const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellDates: true }); return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); }
  const loaded = {};
  function loadScript(src) { if (loaded[src]) return loaded[src]; loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Gagal memuat ' + src)); }; document.head.appendChild(s); }); return loaded[src]; }

  window.UI = { icon, pill, empty, card, chartBox, kpi, pageHead, barCell, dataTable, modal, confirmBox, toast, chart, spark, gauge, destroyCharts, palette, alpha, css, saveFile, workbookBlob, loadScript };
})();

</script>
<script>/* js/pages-dashboard.js */
/* =========================================================================
 * HALAMAN DASHBOARD: Executive, Portfolio, Project, Channel, Traffic
 * ========================================================================= */
(function () {
  'use strict';
  const C = window.Core, U = window.UI, esc = C.esc;
  const Pages = window.Pages = window.Pages || {};
  const A = () => window.App;

  /* ---------- helper bersama ---------- */
  const KPI_DEF = {
    projects: { label: 'Total Project', icon: 'project', fmt: v => C.fmtInt(v) },
    traffic: { label: 'Total Traffic', icon: 'traffic', fmt: C.fmtCompact },
    off: { label: 'Total Inbound', icon: 'phone', fmt: C.fmtCompact, sub: 'Call offered' },
    acc: { label: 'Accepted Call', icon: 'phone', fmt: C.fmtCompact },
    abd: { label: 'Abandon Call', icon: 'phone', fmt: C.fmtCompact },
    ob: { label: 'Outbound', icon: 'phone', fmt: C.fmtCompact },
